name: tests

# Expensive full pytest suite — MAIN-ONLY by design (release merges).
# Running this on every dev PR is too costly on the GitHub Actions free tier
# (~5min wall × the py3.12 matrix per run). Dev-PR coverage is instead:
#   - the cheap scrub gates (check-no-new-shipped-node-ids.yml + manifest-gate.yml) on every PR, and
#   - a local full-suite run after each merge (maintainer-run, $0 quota).
# Manual `workflow_dispatch` is available for an on-demand full run.
# (Decision: Lei 2026-06-01 — CI economics for the alpha release.)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Suite step limit (315) + 15, the nightly's pairing (nightly.yml).
    timeout-minutes: 330
    strategy:
      matrix:
        python-version: ["3.12"]
    env:
      # Skip the optional sentence-transformers embedding code path in CI
      # so we don't pay the ~500MB model download per run. Tests pass either way.
      ENGRAM_NO_EMBEDDINGS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU torch first (#4004, same shape as nightly.yml): the runner has no GPU,
          # and the CUDA stack that sentence-transformers pulls in through torch is
          # ~3G of downloads. Only torch comes from the PyTorch CPU index; the -r
          # install below, from PyPI alone, finds torch already satisfied.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements/requirements-dev.txt
          # src/forum/tests/ import forum.server (Flask + bleach + markdown-it-py +
          # beautifulsoup4 + html5lib); those deps live in src/forum/requirements.txt,
          # not the main requirements. Without this the forum suite errors on
          # import and the gate red-X's. (forum/ shipped in #615; moved to src/forum/
          # in Phase 3 of #1093.)
          pip install -r src/forum/requirements.txt
          # Guard (#4004): CPU torch is the repo rule (requirements-lock.txt header);
          # fail loudly if a CUDA stack came back.
          python3 tools/check_no_cuda_wheels.py

      - name: Collect the reference test-id set
        # The REFERENCE set: exactly what the old one-process step collected
        # (`pytest tests/ src/forum/tests/`, no -m filter, so the `timing` cells
        # are in it). The shards below are checked against this file before any
        # shard runs (K1). Explicit paths (pytest.ini sets no testpaths): the main
        # suite AND src/forum/tests/, the latter silently skipped by the original
        # `pytest tests/` since forum/ postdates this workflow.
        # This stays ONE line starting `run: pytest <roots>`: tests/test_ci_wiring_guard.py
        # (parse_collected_dirs) and tests/test_test_id_set_check.py (the #2950 sync
        # gate against TEST_SCAN_ROOTS) read the roots from it, and stop at the first
        # `-` token.
        # tools/ forum-CLI tests arrive with #616; add `tools/` to this path
        # once #616 merges (omitted now — empty tools/ test set would exit-5).
        run: pytest tests/ src/forum/tests/ --collect-only -q -p no:cacheprovider > "$RUNNER_TEMP/reference-collect.txt"

      - name: Run pytest — the full suite as sequential shards (#4420)
        # One process over the whole suite died of memory on the hosted runner (the
        # nightly's finding, #4420), so this runs on the nightly's shard runner:
        # N sequential pytest processes, files split from pytest's own collection.
        # Planned FROM the reference file above, so the plan and the check use the
        # same collection. Before the first shard, the runner re-collects each shard
        # and compares: every reference id in exactly one shard, none extra, none
        # missing (a failure names the ids and no shard runs). Every shard runs even
        # after a red one, and the step is red if any is. No continue-on-error here.
        # The marker is empty (no -m), so the `timing` cells run inside the shards,
        # as they did in the old one-process step; no coverage (this workflow never
        # had any).
        # Step limit = shards x per-shard limit + 15 (planning and collection
        # headroom), as in nightly.yml. The job limit (330) is the step limit + 15, the
        # nightly's pairing, so the step limit, not the job limit, ends a hang.
        env:
          NIGHTLY_SHARD_COUNT: "5"
          NIGHTLY_SHARD_TIMEOUT_MIN: "60"
          NIGHTLY_MARKER: ""
          NIGHTLY_COVERAGE: "0"
          NIGHTLY_COLLECT_FILE: ${{ runner.temp }}/reference-collect.txt
          NIGHTLY_IDSET_REFERENCE: ${{ runner.temp }}/reference-collect.txt
        timeout-minutes: 315
        shell: bash
        run: bash .github/ci/nightly_run_shards.sh

      - name: Run pytest — name-leak-warn self-test (real roster)
        if: ${{ !cancelled() }}
        # Runs after a red suite step too (#4554): a skip here would hide this step's own result on a red run.
        # Deliberately a SEPARATE step from the full-suite run above, and a
        # multi-line block rather than a single-line `run: pytest` line: two
        # parsers (#2950's scan-roots gate in tools/test_id_set_check.py and
        # tests/test_ci_wiring_guard.py) read tests.yml's single-line
        # `run: pytest <paths>` invocations and take every positional path as a
        # collected root; a narrow single-file run must not join that set.
        # The roster is a secret and these logs can become public, so it is
        # handed only to the one file that needs it, never to the whole suite.
        # The real roster is otherwise exercised only by the release/nightly
        # runs, so a defect in it (e.g. a roster line the self-test cannot
        # compile) waits for a release to appear. Fork PRs get no secret; the
        # two real-file cells skip there by design and the step still passes.
        env:
          NAME_LEAK_ROSTER: ${{ secrets.NAME_LEAK_ROSTER }}
        run: |
          python3 -m pytest tests/test_name_leak_warn.py -v --tb=short --show-capture=no

      - name: Run pytest — test files outside the roots above (#3346)
        if: ${{ !cancelled() }}
        # Runs after a red suite step too (#4554): a skip here would hide this step's own result on a red run.
        # Deliberately a SEPARATE step, not extra positionals on the line
        # above: tools/test_id_set_check.py's TEST_SCAN_ROOTS must equal that
        # line's roots (the #2950 sync gate), and it scans directories, not
        # single files. These nine files are named test_*.py but live in
        # tools/ and src/engram/tools/, so the directory roots never reached
        # them and they ran in no job. Here they run with the full deps, so
        # the forum-server cells that skip under pr-checks' stdlib-only
        # venv (10 in test_forum_backup.py, 49 in test_forum_cli.py) run.
        # tests/test_ci_wiring_guard.py (collected above, under tests/) fails
        # if a tracked test_*.py outside the roots is named by no workflow.
        # test_tripwire.py runs in its own pytest command: it lives in
        # src/engram/tools/, which puts src/engram on sys.path and trips the
        # tests/conftest.py #2565 collision guard for every later `tools.*`
        # import in the same process. `rc` keeps one failure from hiding
        # the other.
        # The forum-server cells need the REAL `forum` package, and
        # importing tools/forum.py (the thick CLI, imported by
        # test_forum_cli.py) shadows it with a flat module -- so under a
        # plain `pytest tools/...` all 59 cells skip even with Flask
        # installed (measured: 123 passed, 59 skipped). The main step above
        # avoids this only because collecting src/forum/tests/ imports the
        # package first. Here the same is done explicitly: PYTHONPATH=src
        # plus importing forum before pytest starts (measured: 182 passed,
        # 0 skipped).
        env:
          PYTHONPATH: src
        run: |
          rc=0
          python -c "import forum.db, forum.server, sys, pytest; sys.exit(pytest.main(sys.argv[1:]))" \
            tools/test_backup_claude_projects.py \
            tools/test_backup_session_logs.py \
            tools/test_forum_backup.py \
            tools/test_forum_backup_alarm.py \
            tools/test_forum_backup_stamp.py \
            tools/test_forum_cli.py \
            tools/test_forum_status_backup.py \
            tools/test_pre_dispatch_check.py \
            -v --tb=short || rc=1
          pytest src/engram/tools/test_tripwire.py -v --tb=short || rc=1
          exit $rc
