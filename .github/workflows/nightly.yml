name: nightly

# Scheduled full pytest suite on dev (#1656, Lei-endorsed 2026-07-04).
#
# Since #1597 demoted affected-tests off per-PR CI, no tests run on dev PRs —
# so the dev→main release cut was the first end-to-end exercise, catching latent
# breakage weeks late (RELEASING.md documented exactly this on rc2). This nightly
# run closes that gap: breakage merged to dev surfaces within ~a day, at a
# fraction of per-PR cost. It COMPLEMENTS, does not replace: the cheap per-PR
# scrub gates, the local full-suite run convention on PRs, and the main-only
# release gate (tests.yml).
#
# Scheduled workflows run from the DEFAULT branch (dev) and check it out by
# default — so this exercises dev, which is the whole point.
on:
  schedule:
    # 03:37 UTC daily. Cron is UTC, so this is 23:37 EDT / 22:37 EST — after
    # the team's sleep time, leaving ~4h of queue headroom before the morning
    # read. Deliberately off-peak and off-:00: GitHub queues on-the-hour
    # scheduled runs heavily and can skip them under load; an odd minute
    # lands far more reliably.
    #
    # After the Nov 2026 DST changeover this fires an hour earlier local time
    # (22:37 EST) — weighed and kept as-is on 2026-09-14 (forum #412 post
    # 9220): firing too early only tests a tip up to an hour older (caught
    # by the next night's run), while firing too late reproduces the
    # morning-read miss this schedule exists to fix. See #2933 for the
    # dated November re-check action.
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  # declaring permissions zeroes every unlisted scope; the on-failure/on-success
  # steps below need issues:write to open/comment/close the ci-nightly issue
  # (umwelt#738 round 3 measured this).
  contents: read
  issues: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    # #4389: the job limit is 15 minutes ABOVE the suite step's 315, so on a live
    # runner the step limit always fires first (a step `failure`, and the in-job
    # notify step below runs) and the job limit never pre-empts that step. The job
    # limit exists for the other case: a LOST runner. A lost runner is released at
    # the job limit + 5 minutes (330 + 5 = 335; the +5 was measured at two limit
    # values with simulated kills), and the `notify-nightly-failure` job below then
    # files the issue. Without a limit the default is 360 minutes, which is also the
    # ceiling a hosted job can be given: 335 stays under it, so the shard count and
    # the per-shard limit below cannot grow without bound (a test pins the sum).
    # #4420: the suite step is N sequential pytest processes, so its limit is the
    # sum of the per-shard limits plus headroom (see the suite step).
    timeout-minutes: 330
    # #4389: set by the in-job notify step ONLY after it filed. The second job
    # reads it to skip a night that was already reported. (It is empty after a
    # lost runner, which is exactly when the second job must file.)
    # `suite_green` is set by the in-job success step as its LAST line: it means the
    # suite step was green AND that step ran to its end. A failing non-suite step
    # after a green suite (coverage upload, summary) must not file an issue.
    outputs:
      notified: ${{ steps.notify_failure.outputs.notified }}
      suite_green: ${{ steps.notify_success.outputs.suite_green }}
    strategy:
      # Costs nothing on a single-entry matrix, and stays correct if the
      # matrix ever grows again — so leave it on rather than remove it.
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    env:
      # Skip the optional sentence-transformers embedding path so we don't pay
      # the ~500MB model download per run. Tests pass either way. (Mirrors
      # tests.yml / affected-tests.yml.)
      #
      # ⚠ COVERAGE TRAP (#2774): with this flag set, the sentence-transformers
      # / embedding code path (EmbeddingManager._load_model / .embed's model
      # branch in engram_core.py; the CrossEncoder path; the embedding-gate
      # check in server.py) is NEVER exercised in this run — not because it's
      # dead code, but because THIS configuration deliberately skips it. Under
      # the coverage-as-spec-completeness-finder framing (#2774), an uncovered
      # line is a candidate flaw-register entry — so without this note, every
      # night manufactures a false flaw for the embedding path. No .coveragerc
      # exclusion is applied for it: the embedding code is interleaved inside
      # large, otherwise-well-tested files (engram_core.py, server.py) rather
      # than isolated in its own module, so a file-level `omit` would hide real
      # gaps in those files, and a line/block-level `exclude_lines` regex
      # risked being wrong in a way that's hard to verify without a second
      # coverage run under ENGRAM_NO_EMBEDDINGS=0. The "Write coverage summary"
      # step below annotates this explicitly instead — read its output before
      # treating embedding-path lines as a real gap.
      ENGRAM_NO_EMBEDDINGS: "1"
      # #4420: N, the number of sequential pytest processes. Basis: the
      # single-process footprint (RSS + swap) was 1.1 GB at test 560, 2.4 GB at
      # 3,278, 3.9 GB at 7,567, 4.9 GB at 12,080, 6.4 GB at 17,370 and about
      # 10.1 GB at 23,929 of about 38,000 tests. A process must stay under about
      # 5 GB (swap onset, not the kill, is the line), which is about 9,000-10,000
      # tests per process, so N = 5 (about 7,500 tests each). One run's
      # measurement; the per-shard peaks in the run summary decide the next value.
      NIGHTLY_SHARD_COUNT: "5"
      # Per-shard limit in minutes, used as `timeout -k 60 <min>m`. The pre-split
      # suite took about 120 minutes of pytest in total, so a shard is expected to
      # take about 25; 60 is a hang bound, not a target.
      NIGHTLY_SHARD_TIMEOUT_MIN: "60"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # No `cache: pip` (#3539): the runner disk was full at cache-save time
          # on every nightly read 09-26..10-07, so the primary key was never
          # saved (every run restored from the fallback restore-key) and on
          # 10-07 the post-step's ENOSPC failed a fully green suite. Without
          # `cache:` setup-python has no post-save step to fail.

      - name: Install dependencies
        run: |
          # --no-cache-dir on every pip call (#3539): the pip wheel cache was ~3G
          # on the runner (torch + CUDA stack) and is never reused on an
          # ephemeral runner, so it only eats disk.
          python -m pip install --no-cache-dir --upgrade pip
          # CPU torch first (#3539 follow-up): the runner has no GPU, so the CUDA
          # stack that sentence-transformers pulls in through torch (~3G of
          # downloads) is pure install size. Only the torch index changes;
          # sentence-transformers and the requirements files are untouched, and
          # the -r install below then finds torch already satisfied.
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements/requirements-dev.txt
          # src/forum/tests/ import forum.server (Flask + bleach + markdown-it-py +
          # beautifulsoup4 + html5lib) — deps live in src/forum/requirements.txt,
          # not the main requirements. (Same as tests.yml.)
          pip install --no-cache-dir -r src/forum/requirements.txt
          # Guard (#4004): CPU torch is the repo rule (requirements-lock.txt header);
          # fail loudly if a CUDA stack came back.
          python3 tools/check_no_cuda_wheels.py

      - name: disk usage — before suite
        # #3539 — MEASUREMENT ONLY. Contract: a disk-read step can NEVER change
        # the job's conclusion. GitHub runs `shell: bash` as `bash -e -o pipefail`.
        # errexit is not inherited into `$(...)`, but pipefail is, so the
        # substitution's status can be non-zero: the `|| true` inside it and the
        # assignment's `)" || true` are two layers, each sufficient alone. The
        # summary-append guard is separately load-bearing (a full disk can make
        # that write fail). `continue-on-error: true` is the last backstop.
        # The ci-nightly notify steps below key on `steps.suite.outcome` and
        # `steps.timing.outcome` (#3784); this step is not read by them.
        # Paired with the `after suite` step to attribute disk growth to the
        # suite (e.g. pytest tmp_path dirs) rather than to guesswork.
        continue-on-error: true
        # A timeout under continue-on-error cannot change the job conclusion.
        timeout-minutes: 10
        shell: bash
        run: |
          # Runs under -e -o pipefail; every command is guarded — see contract above.
          OUT="$(
            echo '$ df -h /'; df -h / 2>&1 || true
            echo; echo '$ df -h /tmp'; df -h /tmp 2>&1 || true
            echo; echo '$ du -xsh <path>'
            for p in /tmp "${RUNNER_TEMP}" "${GITHUB_WORKSPACE}" "${HOME}/.cache"; do
              if [ -n "$p" ] && [ -e "$p" ]; then du -xsh "$p" 2>/dev/null || true; fi
            done
            for d in /tmp "${GITHUB_WORKSPACE}"; do
              if [ -n "$d" ] && [ -d "$d" ]; then
                echo; echo "$ du -x -d 3 $d | sort -h | tail -20"
                du -x -d 3 "$d" 2>/dev/null | sort -h | tail -20 || true
              fi
            done
          )" || true
          printf '%s\n' "$OUT" || true
          # Summary write is non-fatal too: on a full disk this append can fail.
          {
            printf '### disk usage — before suite\n\n```\n%s\n```\n' "$OUT" >> "$GITHUB_STEP_SUMMARY"
          } 2>/dev/null || true

      - name: Run full pytest suite
        # Same files as tests.yml (pytest.ini sets no testpaths): the main suite AND
        # src/forum/tests/. (#4420) They run as N SEQUENTIAL pytest processes, not one:
        # a single process grew past the runner's RAM (about 10 GB at test 23,929 of
        # about 38,000, extrapolated 15-17 GB for the whole suite; the runner has
        # 7.9 GB), so the run slowed under swap and died. The files are split by
        # .github/ci/nightly_shards.py from pytest's own collection (contiguous groups
        # balanced by test count, a file never split), so a new test file needs no
        # edit here. No xdist: shards are sequential, never parallel. Each shard
        # writes its own coverage data file; the combine step below merges them.
        # .github/ci/nightly_run_shards.sh carries the pytest flags described below.
        #
        # Coverage (#2774): --cov-branch, not line-only — a line executed on
        # only one side of an `if` is a behaviour half-specified, and this
        # coverage run is a SPEC-completeness finder (candidate flaw-register
        # entries), not a quality gate. Deliberately NO --cov-fail-under and
        # no threshold anywhere in this workflow — the output is a list of
        # uncovered locations, not a number to optimise.
        #
        # ⚠ WAS A DEFECT — FIXED BY THE SINGLE `--cov=src` ROOT BELOW. DO NOT
        # "clarify" it back into `--cov=src/engram --cov=src/forum`. That was
        # the original shape here, and it silently broke coverage.xml (not the
        # terminal report, not htmlcov/ — only the XML that diff-cover and the
        # "Write coverage summary" step below both parse): coverage.py's
        # Cobertura writer groups classes by (package, filename) relative to
        # each --cov root, and both src/engram and src/forum have a root "."
        # package containing a file named server.py — the two roots' XML
        # <class filename="server.py"> entries collided into ONE, one
        # silently overwriting the other (verified: reordering the two --cov
        # flags did not change which one won, so this wasn't a simple
        # ordering fix). A single `--cov=src` root resolves it — coverage.py
        # then emits distinct filename="engram/server.py" and
        # filename="forum/server.py" entries (verified by grepping the
        # emitted XML for filename="[^"]*server\.py" under both shapes).
        #
        # The single-root switch has its OWN failure mode if unaccompanied:
        # neither src/engram nor src/build has a top-level __init__.py, and
        # coverage.py's "report files nobody ever imported, as a gap" walk
        # requires __init__.py in every subdirectory below the named --cov
        # root unless `include_namespace_packages = True` — so `.coveragerc`
        # carries that setting, and it is NOT optional decoration. See
        # `.coveragerc`'s own `[report]` comment for the measured before/after
        # (22 vs 137 engram files reported on an identical test subset).
        #
        # SCOPE CONSEQUENCE, named rather than left to be discovered: src/
        # holds THREE packages (src/build, src/engram, src/forum), so
        # `--cov=src` also brings src/build (the packaging/build engine) into
        # the measured set — the old two-root flag excluded it. Judged
        # correct, not incidental: build code is production code whose
        # behaviour should be specified too, under this project's
        # prescriptive-SPEC framing.
        id: suite
        # #4389/#4420: step limit = the sum of the per-shard limits plus 15 minutes of
        # headroom for the planning and collection steps and the sampler's start:
        # 5 shards x 60 min + 15 = 315. A hung shard is killed by its own limit (and
        # named in the log) and the loop goes on, so a hang costs at most one limit;
        # this step limit is the outer bound, and a step limit is a failure, so the
        # in-job notify step below fires. The job limit above is this + 15.
        timeout-minutes: 315
        shell: bash
        run: |
          # The shards, their per-shard timeout, the pipefail/tee handling, the
          # sampler and the exit status (red if ANY shard is red; every shard runs)
          # all live in the script. Its stdout is the live log; all shards are also
          # tee'd into /tmp/nightly-output.log, whose tail the notify step prints.
          # -o tmp_path_retention_policy=failed (#3539), -m "not timing" (#3784) and
          # --cov=src --cov-branch (#2774) are carried into every shard unchanged.
          bash .github/ci/nightly_run_shards.sh

      - name: disk usage — after suite
        # #3539 — MEASUREMENT ONLY, same contract as `disk usage — before suite`:
        # continue-on-error, `|| true` layers inside and around the `$(...)`
        # (shell is `bash -e -o pipefail`; see the before-step comment).
        # `!cancelled()` so it still reads the disk when the suite is red (a
        # full disk is the likeliest reason for that).
        if: ${{ !cancelled() }}
        continue-on-error: true
        # A timeout under continue-on-error cannot change the job conclusion.
        timeout-minutes: 10
        shell: bash
        run: |
          # Runs under -e -o pipefail; every command is guarded — see contract above.
          OUT="$(
            echo '$ df -h /'; df -h / 2>&1 || true
            echo; echo '$ df -h /tmp'; df -h /tmp 2>&1 || true
            echo; echo '$ du -xsh <path>'
            for p in /tmp "${RUNNER_TEMP}" "${GITHUB_WORKSPACE}" "${HOME}/.cache"; do
              if [ -n "$p" ] && [ -e "$p" ]; then du -xsh "$p" 2>/dev/null || true; fi
            done
            for d in /tmp "${GITHUB_WORKSPACE}"; do
              if [ -n "$d" ] && [ -d "$d" ]; then
                echo; echo "$ du -x -d 3 $d | sort -h | tail -20"
                du -x -d 3 "$d" 2>/dev/null | sort -h | tail -20 || true
              fi
            done
          )" || true
          printf '%s\n' "$OUT" || true
          # Summary write is non-fatal too: on a full disk this append can fail.
          {
            printf '### disk usage — after suite\n\n```\n%s\n```\n' "$OUT" >> "$GITHUB_STEP_SUMMARY"
          } 2>/dev/null || true

      - name: Run timing cells (no coverage)
        # #3784 — the cells the suite step deselects with -m "not timing", run
        # with NO tracer so their measured ratios are judged in the regime they
        # were calibrated in. `!cancelled()` so a red coverage step does not
        # drop this signal. Its own id: both ci-nightly notify steps read this
        # step's outcome AND the suite step's, so a red timing step opens the
        # issue and a green suite cannot close an issue while timing is red.
        # `-m timing` always collects at least the stage-accounting cell (a cell
        # that skips still counts as collected), so pytest's exit code 5 (no
        # tests collected) cannot occur while the marker is in use; it is
        # deliberately NOT swallowed, so a deleted marker turns this step red.
        # `-rs` lists skips, so a cell that skipped under an unexpected tracer
        # shows its named reason instead of passing quietly.
        if: ${{ !cancelled() }}
        id: timing
        shell: bash
        run: |
          set -o pipefail
          # `|| rc=$?` keeps pytest's own exit code (pipefail makes the pipeline
          # status pytest's) without tripping the runner's `-e`.
          rc=0
          pytest tests/ src/forum/tests/ -v --tb=short -rs \
            -o tmp_path_retention_policy=failed \
            -m timing \
            2>&1 | tee /tmp/nightly-timing.log || rc=$?
          # Under a tracer every timing cell SKIPS (conftest.py's
          # TRACER_SKIP_REASON) and pytest still exits 0: the bound would be
          # unjudged while the step is green and the ci-nightly issue could
          # close. So a skip reason in this step's own log fails the step. The
          # text is the tail of TRACER_SKIP_REASON; a test pins that it stays so.
          # `grep` sits in an `if`, so a no-match (1) never trips -e/pipefail.
          if grep -q -F 'judged in the no-coverage timing step' /tmp/nightly-timing.log; then
            echo "::error::timing cells were skipped under a tracer, so the timing bound was NOT judged"
            [ "$rc" -ne 0 ] || rc=1
          fi
          exit "$rc"

      - name: Combine shard coverage
        # #4420: each shard wrote its own data file (.coverage.<k>); this merges
        # them and produces the artifacts at the same root paths the single-process
        # run did (coverage.xml, htmlcov/, the terminal report), so the upload and
        # summary steps below are unchanged. `if: always()` so a red or timed-out
        # shard still yields the partial report (#2774).
        #
        # `source = src` is added to the rc file for this step only, mirroring the
        # `--cov=src` each shard ran with. Without it the combined XML lists files
        # as src/engram/server.py instead of engram/server.py (a different path
        # root, which the summary and diff-cover read) because the report no longer
        # knows the source root pytest-cov was given. .coveragerc itself is not
        # changed: other callers pass --cov=src themselves.
        if: always()
        shell: bash
        run: |
          python3 - <<'PYEOF'
          src = open(".coveragerc", encoding="utf-8").read()
          assert src.count("[run]\n") == 1, "expected exactly one [run] section in .coveragerc"
          open(".coveragerc.combine", "w", encoding="utf-8").write(
              src.replace("[run]\n", "[run]\nsource = src\n", 1))
          PYEOF
          export COVERAGE_RCFILE=.coveragerc.combine
          python3 -m coverage combine .coverage.[0-9]*
          python3 -m coverage xml -o coverage.xml
          python3 -m coverage html -d htmlcov
          python3 -m coverage report

      - name: Shard summary (results and peak memory)
        # #4420 — MEASUREMENT ONLY: continue-on-error, so it can never flip the
        # night. It still exits non-zero (and prints an ::error:: naming the shard)
        # when a shard has no sampler peak line: a gap is loud, never a quiet 0.
        if: always()
        continue-on-error: true
        shell: bash
        run: python3 .github/ci/nightly_shard_summary.py --n "$NIGHTLY_SHARD_COUNT" --sampler-log /tmp/sampler.log --dir /tmp

      - name: Upload coverage artifacts
        # A red suite should still yield its partial report (#2774) — hence
        # if: always() rather than the implicit success()-only default.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

      - name: Write coverage summary
        # #2774 — coverage is a SPEC-completeness finder: this writes total %
        # plus the lowest-covered files to the run page summary so the number
        # is readable without downloading the artifact. if: always() so a red
        # suite still gets its partial summary (pytest-cov writes coverage.xml
        # even when tests fail, unless the run crashes before pytest starts).
        if: always()
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import os
          import xml.etree.ElementTree as ET

          path = "coverage.xml"
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          def write(text):
              if summary_path:
                  with open(summary_path, "a") as f:
                      f.write(text)
              else:
                  print(text, end="")

          if not os.path.isfile(path):
              write(
                  "## Coverage (issue #2774)\n\n"
                  "`coverage.xml` was not produced -- the suite likely failed before "
                  "pytest-cov could write it. No coverage summary available for this "
                  "run.\n"
              )
              raise SystemExit(0)

          try:
              root = ET.parse(path).getroot()
          except ET.ParseError as e:
              # A present-but-malformed/truncated coverage.xml (e.g. the
              # runner OOMs or is killed mid-write) must fail loud with a
              # clear message naming the file, not a bare traceback -- and
              # not silently emit nothing either (that would be the same
              # silent-failure class this whole PR exists to close). Same
              # "no coverage summary available" fallback shape as the
              # missing-file guard above.
              write(
                  "## Coverage (issue #2774)\n\n"
                  "`{}` could not be parsed as XML ({}). It was produced but "
                  "is malformed or truncated -- likely the run was killed "
                  "mid-write. No coverage summary available for this "
                  "run.\n".format(path, e)
              )
              raise SystemExit(0)

          line_rate = float(root.get("line-rate", "0"))
          branch_rate = float(root.get("branch-rate", "0"))

          rows = []
          for package in root.findall(".//package"):
              for cls in package.findall("./classes/class"):
                  # filename is already the full path relative to the --cov=src
                  # root (e.g. "engram/server.py", "build/engine/build.py") --
                  # verified against a real run with include_namespace_packages
                  # = True (#2774): do NOT prepend the package name too, that
                  # double-counts it (package "build.engine" + filename
                  # "build/engine/build.py" would wrongly read
                  # "build.engine/build/engine/build.py").
                  display = cls.get("filename", "")
                  lr = float(cls.get("line-rate", "0"))
                  br_attr = cls.get("branch-rate")
                  br = float(br_attr) if br_attr is not None else None
                  lines = cls.findall("./lines/line")
                  lines_valid = len(lines)
                  branches_valid = sum(1 for ln in lines if ln.get("branch") == "true")
                  if lines_valid == 0:
                      continue
                  sort_key = br if (br is not None and branches_valid > 0) else lr
                  rows.append((sort_key, display, lr, br))

          rows.sort(key=lambda r: r[0])
          lowest = rows[:10]

          out = []
          out.append("## Coverage (issue #2774 -- spec-completeness finder, not a quality gate)\n\n")
          out.append("**Total: {:.1f}% line / {:.1f}% branch**\n\n".format(line_rate * 100, branch_rate * 100))
          out.append(
              "One known blind spot in this report -- read before treating a row "
              "below as a real gap: `ENGRAM_NO_EMBEDDINGS=1` skips the "
              "sentence-transformers / embedding path (in `engram_core.py`, "
              "`server.py`) -- it is not dead code, this run configuration "
              "deliberately doesn't exercise it. See the workflow's own comment "
              "above the pytest step.\n\n"
              "(A prior version of this report also warned that "
              "`src/engram/server.py` and `src/forum/server.py` collided into "
              "one XML row -- fixed by switching to a single `--cov=src` root; "
              "see the workflow's comment above the pytest step and "
              "`.coveragerc`'s `[report]` comment for why that flag must stay "
              "as one root.)\n\n"
          )
          out.append("**Lowest-covered files** (branch coverage where available, else line):\n\n")
          out.append("| file | line % | branch % |\n|---|---|---|\n")
          for _, display, lr, br in lowest:
              br_s = "{:.1f}%".format(br * 100) if br is not None else "n/a"
              out.append("| `{}` | {:.1f}% | {} |\n".format(display, lr * 100, br_s))

          write("".join(out))
          PYEOF

      - name: ensure the ci-nightly label exists
        # gh label create --force is idempotent, so this is safe to run every
        # night; unlike umwelt's origin repo the label doesn't pre-exist here.
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh label create ci-nightly --description "nightly full-suite failure tracking" --color B60205 --force

      # GitHub docs: "A default status check of `success()` is applied unless
      # you include one of these functions." The carve-out functions are
      # success(), failure(), always(), cancelled(); a plain expression such
      # as `steps.suite.outcome == 'success'` gets success() ANDed in, and
      # !cancelled() opts out of that default. !cancelled() means a run that
      # a PERSON cancelled notifies nothing from these two steps; the promise
      # they make is "notify steps cannot be masked by a label-step failure",
      # not "cannot be masked" (alpha#2275 round 4).
      #
      # What a time limit does now (#4389): a hung suite on a live runner ends as
      # a step failure at 315 minutes, and this step notifies. A job-limit cancel
      # on a live runner, or a lost runner bounded by the 330-minute job limit,
      # kills or skips this step, and the `notify-nightly-failure` job below
      # notifies instead. Only a cancel BY A PERSON notifies nothing at all
      # (the alpha#2275 reasoning stands: a person who cancels does not want an issue).
      - name: on failure — open or update the ci-nightly issue
        # Fires when the suite step did not succeed (red, or skipped because
        # install failed) and the job was not cancelled. The bare failure()
        # it replaces was too broad — true on any prior step's failure, so a
        # failed label step on a green night filed a false issue with a
        # passing log tail.
        if: ${{ !cancelled() && (steps.suite.outcome != 'success' || steps.timing.outcome != 'success') }}
        id: notify_failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          DATE="$(date -u +%Y-%m-%d)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TAIL="$(tail -n 40 /tmp/nightly-output.log 2>/dev/null || echo '(log unavailable — the job failed before the pytest step ran)')"
          # #3784: a red timing step must show its own tail too.
          TIMING_TAIL="$(tail -n 40 /tmp/nightly-timing.log 2>/dev/null || echo '(timing log unavailable)')"
          BODY="Nightly full-suite run failed: ${RUN_URL}

          \`\`\`
          ${TAIL}
          \`\`\`

          Timing step (no coverage):

          \`\`\`
          ${TIMING_TAIL}
          \`\`\`"
          EXISTING="$(gh issue list --label ci-nightly --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "nightly CI failure — ${DATE}" \
              --label ci-nightly \
              --body "$BODY"
          fi
          # #4389: the output is set only after the issue call above returned
          # success (`set -e` aborts before this line otherwise). The second job
          # reads it to skip a night that was already reported.
          # A lost runner in the gap between the issue create and this line gives
          # ONE extra update from the second job (a comment on the issue just
          # created). That is accepted: it is one comment, never a missed night.
          echo "notified=true" >> "$GITHUB_OUTPUT"

      - name: on success — close any open ci-nightly issue
        # Fires when the suite succeeded and the job was not cancelled. A
        # bare `steps.suite.outcome == 'success'` would inherit the default
        # success() and be skipped whenever the label step failed.
        if: ${{ !cancelled() && steps.suite.outcome == 'success' && steps.timing.outcome == 'success' }}
        id: notify_success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          DATE="$(date -u +%Y-%m-%d)"
          EXISTING="$(gh issue list --label ci-nightly --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "green on ${DATE}"
            gh issue close "$EXISTING"
          fi
          # #4389: the output is the LAST line, set only after the calls above
          # returned success (`set -e` aborts before it otherwise). The second job
          # reads it so that a green suite followed by a failing non-suite step
          # (coverage upload, summary, label) files nothing. A lost runner between
          # a green suite and this line leaves the output empty, and the second job
          # files: that is right, because the night did not finish.
          echo "suite_green=true" >> "$GITHUB_OUTPUT"

  # #4389: files the ci-nightly issue when the `pytest` job did not succeed and
  # its own in-job notify step did not already file. Why it exists: the in-job
  # notify steps run on the same runner as the suite, so they die with it when a
  # hosted runner is lost, and the night went unreported. This job runs on its
  # own fresh runner after `pytest` ends, however it ends.
  #
  # The gate is `!cancelled()`, not `always()`: a run a PERSON cancelled files
  # nothing (same reasoning as alpha#2275), while a job-limit cancel or a lost
  # runner is a cancel of the `pytest` JOB, not of the run, so this job still runs.
  #
  # The same-night skip rests on the `notified` job output and NOT on an issue-list
  # read: `gh issue list` and the REST list missed an issue written one second
  # earlier (measured), so a list read here could file a duplicate of the issue the
  # in-job step had just created. The output is empty after a lost runner, which
  # is the case this job is for.
  #
  # It has no log tail: the suite ran on a runner this job cannot read, and the
  # log file lived on that runner. The issue body says so and points at the run.
  # No checkout either: nothing here needs the repository, only `gh`.
  notify-nightly-failure:
    needs: pytest
    if: ${{ !cancelled() && needs.pytest.result != 'success' && needs.pytest.outputs.notified != 'true' && needs.pytest.outputs.suite_green != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: ensure the ci-nightly label exists
        # Same as the label step in `pytest`: idempotent, and a missing label makes
        # `gh issue create` fail, so it is created here too (that job's copy may
        # never have run).
        shell: bash
        run: gh label create ci-nightly --description "nightly full-suite failure tracking" --color B60205 --force

      - name: open or update the ci-nightly issue
        shell: bash
        env:
          RESULT: ${{ needs.pytest.result }}
        run: |
          set -e
          DATE="$(date -u +%Y-%m-%d)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="Nightly full-suite run did not succeed: ${RUN_URL}

          The suite job ended with result: ${RESULT}

          This issue has NO LOG TAIL: the job that ran the suite did not report one
          (a lost runner, or a job that hit its time limit). Read the run's own page
          above for what happened."
          # A list read is fine HERE: an open issue found now is from an earlier
          # night, hours old. (The same-night skip is the job's `if:`, not this.)
          # A failed read must not swallow the report: file a NEW issue anyway (never a
          # comment, there is no number) and say so in the body. If that create fails
          # too, `set -e` ends the script non-zero (a red job).
          LIST_FAILED=""
          EXISTING="$(gh issue list --label ci-nightly --state open --json number --jq '.[0].number // empty')" || LIST_FAILED=1
          if [ -n "$LIST_FAILED" ]; then
            BODY="${BODY}

          NOTE: the list read failed, so an older open ci-nightly issue may exist
          that this report could not be attached to."
            EXISTING=""
          fi
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "nightly CI failure — ${DATE}" \
              --label ci-nightly \
              --body "$BODY"
          fi
