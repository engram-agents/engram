name: affected-tests

# MANUAL ONLY — `workflow_dispatch`. This does NOT run automatically on any
# pull request. It was moved off per-PR CI by #1597; running affected-tests is
# now a LOCAL review requirement, and the full suite (tests.yml) runs on the
# dev→main release PR.
#
# Comment corrected in #2361: the two lines below used to read "Import-graph
# selective pytest on every dev PR", describing the pre-#1597 behaviour four
# lines above its own `on:` block. Nothing here has run per-PR since #1597.
#
# What it does WHEN DISPATCHED: import-graph selective pytest — only the tests
# affected by the changed files, via src/engram/tools/run_touched_tests.py
# (Layer 1: static import graph; Layer 2: packaging/test-map.json convention
# map).
#
# Fail-open: any changed file unresolved by both layers triggers the full
# suite so a new surface can never silently escape coverage.
#
# This gate intentionally does NOT replace the full suite (tests.yml,
# main-only). Its output — "SUBSET green" or "Full suite green (fallback)"
# — is an iteration signal, not a convergence claim. The full suite gates
# merge-readiness at main-merge time.
#
# Decision (Lei 2026-06-23, issue #1358): mechanical gate > vigilance for
# dev-PR coverage. A SyntaxError in a hook (#1347 → #1356) merged to dev
# green because no tests ran on dev PRs.
#
# HISTORICAL: that paragraph describes why this workflow was created, and
# "closes that gap" was true while it ran on dev PRs. Since #1597 it does not,
# so the #1358 gap is currently covered by the LOCAL review requirement rather
# than by this file. Stated plainly (#2361) because the previous wording read
# as a live guarantee.
on:
  workflow_dispatch:

jobs:
  affected-tests:
    runs-on: ubuntu-latest
    env:
      # Skip optional sentence-transformers embedding code path (avoids ~500MB
      # model download per run). Tests pass either way.
      ENGRAM_NO_EMBEDDINGS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch enough history for the base-branch diff.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements-dev.txt
          # src/forum/tests/ imports forum.server (Flask + bleach + markdown-it-py
          # + beautifulsoup4 + html5lib); those deps live in src/forum/requirements.txt.
          # Without this, forum-touching PRs select forum tests but fail on import.
          pip install -r src/forum/requirements.txt

      - name: Run affected tests
        run: |
          # github.base_ref is empty on workflow_dispatch (#3410); fall back to
          # the default branch so a manual run diffs against a real base.
          python src/engram/tools/run_touched_tests.py \
            --base origin/${{ github.base_ref || github.event.repository.default_branch }} \
            -- -v --tb=short
