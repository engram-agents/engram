name: name-leak-warn

# Warn-only gate: surface personal/agent name mentions newly added by a PR diff.
# Job always exits success — this is an advisory gate, not a merge blocker.
#
# Activation: an org/repo admin must set the NAME_LEAK_ROSTER secret (one-time
# maintainer action). Until then the gate self-skips harmlessly. Fork PRs also
# self-skip (secrets are unavailable in fork contexts).
#
# NAME_LEAK_ROSTER format: newline-separated regex patterns, applied as-written.
# Authors encode their own word boundaries / case handling per pattern.
# Example:
#   \bAlice Example\b
#   \bagentname-nick\b

on:
  pull_request:
    branches: [dev, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  name-leak-warn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history so the PR's base branch is reachable.

      - name: Check for name-leak roster secret
        id: roster-check
        run: |
          if [ -z "$NAME_LEAK_ROSTER" ]; then
            echo "NAME_LEAK_ROSTER not configured — name-leak warn-gate skipped" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NAME_LEAK_ROSTER: ${{ secrets.NAME_LEAK_ROSTER }}

      - name: Compute diff and scan for name mentions
        if: steps.roster-check.outputs.skip == 'false'
        id: scan
        continue-on-error: true
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff

          echo "$NAME_LEAK_ROSTER" > /tmp/roster.txt

          python3 tools/name_leak_warn.py \
            --roster-file /tmp/roster.txt \
            --diff-file /tmp/pr.diff \
            --format json > /tmp/scan_result.json

          # Count matches
          MATCH_COUNT=$(python3 -c "
          import json, sys
          data = json.load(open('/tmp/scan_result.json'))
          print(len(data.get('matches', [])))
          ")

          echo "match_count=$MATCH_COUNT" >> "$GITHUB_OUTPUT"
        env:
          NAME_LEAK_ROSTER: ${{ secrets.NAME_LEAK_ROSTER }}

      - name: Post or update PR comment
        if: steps.roster-check.outputs.skip == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MATCH_COUNT: ${{ steps.scan.outputs.match_count }}
        run: |
          MARKER="<!-- name-leak-warn -->"

          # Find existing comment with our marker (upsert — no spam on re-push)
          EXISTING_ID=$(gh api \
            repos/${{ github.repository }}/issues/${PR_NUMBER}/comments \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" \
            | head -1)

          if [ "$MATCH_COUNT" -gt 0 ]; then
            # Build comment body listing matches
            MATCHES_TEXT=$(python3 -c "
          import json
          data = json.load(open('/tmp/scan_result.json'))
          lines = []
          for m in data.get('matches', []):
              lines.append(f\"- \`{m['file']}:{m['line_number']}\` (pattern {m['pattern_index']}): \`{m['line'].strip()}\`\")
          print('\n'.join(lines))
          ")
            BODY="${MARKER}
          ### Name-leak warn-gate: ${MATCH_COUNT} match(es) found

          The following added lines match the name-leak roster. These may be
          valid citations or unintended leaks — please review each one and
          decide whether to keep or scrub.

          ${MATCHES_TEXT}

          *This is an advisory comment only — it does not block merge.*"
          else
            BODY="${MARKER}
          ### Name-leak warn-gate: no matches on current tip

          No personal/agent name mentions found in the diff against \`${{ github.base_ref }}\`.

          *This is an advisory comment only — it does not block merge.*"
          fi

          if [ -n "$EXISTING_ID" ]; then
            # Update existing comment
            gh api --method PATCH \
              repos/${{ github.repository }}/issues/comments/${EXISTING_ID} \
              -f body="$BODY"
          else
            # Create new comment
            gh pr comment "$PR_NUMBER" --body "$BODY"
          fi
