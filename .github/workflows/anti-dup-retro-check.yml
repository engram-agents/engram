name: anti-dup-retro-check

# Issue #1439 — retroactive duplicate-PR gate, fires when a PR merges.
# Problem: anti-dup-check.yml fires at open/push time and correctly warns
# when two PRs race on the same issue. But if PR A merges (auto-closing #N),
# PR B's gate result stays GREEN — no new push occurred, so the gate never
# re-fires. PR B silently becomes a duplicate.
#
# This workflow closes that window: on every merge to dev/main it scans
# all remaining open PRs for closing-keyword references to any issue that
# the merged PR just closed, then posts a failing check-run and a comment
# on each orphaned PR.
#
# Informational + retroactive — always exits 0 so it does not fail the
# triggering (just-merged) PR.
#
# Companion to anti-dup-check.yml (v1 / open-time gate). Same body-grep
# approach: GitHub's closingIssuesReferences GraphQL field is dormant on
# stacked/non-default-base PRs, so body-text matching is the reliable signal.

on:
  pull_request:
    types: [closed]
    # NO `branches:` FILTER, deliberately (#2361) — the filter matches the BASE
    # branch, so this retro check never ran when a stacked PR merged into its
    # parent feature branch. The job's own `merged == true` guard still gates
    # the work; widening the trigger only widens WHICH merges it can see.

jobs:
  anti-dup-retro:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: write
      checks: write
    steps:
      - name: Identify orphaned PRs and post failing gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGED_PR: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
          # Read via env, never templated into the run: script below. `base.ref`
          # is not attacker-controllable from a fork today, so this is not a live
          # injection -- but "not currently exploitable" is a property of the
          # trigger set, not of the code, and the trigger set is exactly what
          # #2361 just changed. (#2361 round-2 review.)
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Strip inline-code spans before grepping — GitHub's auto-close parser
          # ignores keywords inside backticks (verified #1191), and CLAUDE.md
          # recommends backticking close-keyword examples to avoid parser trips.
          # Same stripping logic as anti-dup-check.yml (v1).
          BODY_STRIPPED=$(printf '%s' "$PR_BODY" | sed 's/`[^`]*`//g')

          # Extract issue numbers referenced with a closing keyword in the body.
          CLOSING_NS=$(printf '%s' "$BODY_STRIPPED" \
            | grep -ioE '(close[sd]?|fix(es|ed)?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' | sort -u)

          if [ -z "$CLOSING_NS" ]; then
            echo "Merged PR #$MERGED_PR has no closing-keyword issue references. Nothing to do."
            exit 0
          fi

          echo "Merged PR #$MERGED_PR closes issue(s): $(printf '#%s ' $CLOSING_NS)"

          # Fetch all open PRs in one call to avoid repeated API round-trips.
          # headRefOid is needed to target the check-run at the correct commit SHA.
          # Colleague-review finding (Borges, PR#2375): the first cut here used
          # `|| true`, matching CHECK_RESULT's fix -- but CHECK_RESULT's failure
          # STAYS VISIBLE (its content-based dispatch below prints an explicit
          # "FAILED -- ..." line either way). Here, `|| true` combined with
          # `2>/dev/null` made a real `gh pr list` failure INDISTINGUISHABLE
          # from the genuine "no open PRs" case -- both produce an empty/absent
          # OPEN_PRS_JSON, both hit the same branch below, both print "No open
          # PRs to scan." and exit 0. That converts this errexit fix's own
          # failure mode from LOUD (crash) to SILENT (looks like success) --
          # the wrong direction, and the opposite of what CHECK_RESULT/
          # COMMENT_RESULT's fixes do. Confirmed via a stubbed failing `gh`:
          # indistinguishable from a clean empty scan, exactly as flagged.
          #
          # Fixed by matching this file's OWN established idiom for this exact
          # situation (see ISSUE_JSON below): `if ! VAR=$(...); then warn;
          # exit 0; fi` -- still exit-0 (the file's contract, unchanged), but
          # now LOUD about which case actually happened.
          if ! OPEN_PRS_JSON=$(gh pr list --repo "$REPO" --state open \
            --json number,headRefOid,title,body --limit 200 2>/dev/null); then
            echo "::warning::anti-dup-retro: could not fetch open PRs (gh pr list failed). Skipping this run -- could not scan for orphaned PRs."
            exit 0
          fi

          if [ "$OPEN_PRS_JSON" = "[]" ]; then
            echo "No open PRs to scan."
            exit 0
          fi

          PR_COUNT=$(printf '%s' "$OPEN_PRS_JSON" | jq 'length')
          echo "Scanning $PR_COUNT open PR(s)."
          if [ "$PR_COUNT" -ge 200 ]; then
            echo "WARNING: open-PR list is at the 200-PR fetch limit — orphaned PRs beyond position 200 may be missed."
          fi

          # Both $MERGED_PR and each $N are digit-only (extracted via grep [0-9]+),
          # so direct interpolation into jq filters is safe (no injection risk).
          for N in $CLOSING_NS; do
            echo ""
            echo "-- Scanning for orphaned PRs targeting #$N --"

            # ── Is issue #N ACTUALLY closed? ────────────────────────────────
            # A closing keyword in a merged PR body does NOT imply the issue
            # closed: GitHub only auto-closes on merge into the repository's
            # DEFAULT branch. Before #2361 this workflow was base-filtered to
            # [dev, main] and the assumption held for dev; #2361 widened it to
            # every base so stacked PRs get scrubbed, which makes the inference
            # unsound — a stacked PR merging into its parent feature branch
            # closes nothing, and this workflow would then post a FAILING
            # check-run plus a comment on someone else's open PR accusing it of
            # duplicating an issue that is still open. Found by a reviewer pass
            # on #2361; the same defect already existed for main-targeted merges
            # (main is not the default branch either), so this fixes that too.
            #
            # Mirrors the real-state check in pr-checks.yml's anti-dup step.
            # DELIBERATE DIFFERENCE on the error path: that step WARNS and
            # continues, because its failure mode is a missed warning on the
            # author's own PR. Here the failure mode is a false accusation
            # posted on a THIRD PARTY's PR, so an unresolvable state SKIPS.
            # Silence is the safe direction when the output lands on someone
            # else's work.
            # Query the issues endpoint, which serves BOTH issues and PRs, and
            # take state + is-it-a-PR in ONE call. Round-2 review measured the
            # trap this closes: `gh issue view` on a CLOSED-but-unmerged PR
            # number returns state=CLOSED, indistinguishable from a genuinely
            # closed issue -- so a closing keyword pointing at a PR number
            # would satisfy the guard and re-open the false-accusation path
            # this guard exists to shut. `.pull_request` is present only on PRs.
            # BRANCH ON EXIT STATUS, NOT ON EMPTINESS. Round-3 review measured
            # why: on a 404 (and any structured HTTP error) `gh api` prints its
            # JSON error body to STDOUT and exits 1, so the capture is NON-empty
            # and an emptiness test never fires. The round-2 fix this replaces
            # tested `-z` and was therefore unreachable for the dominant real
            # failure shape -- it fell through to state=UNKNOWN and printed a
            # line that reads like an ordinary business-logic skip. A check
            # whose failure looks like its success is worse than no check.
            # `|| echo ""` cannot help either: it decides whether an ADDITIONAL
            # echo runs, it does not erase what the failing command already
            # wrote to stdout.
            if ! ISSUE_JSON=$(gh api "repos/$REPO/issues/$N" 2>/dev/null); then
              # Unresolvable, NOT open. Skip -- the output of this workflow
              # lands on a THIRD PARTY's PR, so silence beats a guess. But say
              # so LOUDLY: a transient API failure here drops the one safety
              # net the workflow provides, and a silent drop is
              # indistinguishable from a clean run. (#2361 rounds 2 and 3.)
              echo "::warning::anti-dup-retro: could not resolve #$N (gh api failed). Skipping to avoid a false duplicate accusation; this run did NOT check #$N."
              continue
            fi
            if printf '%s' "$ISSUE_JSON" | jq -e 'has("pull_request")' >/dev/null; then
              echo "#$N is a PULL REQUEST, not an issue -- a closing keyword cannot orphan it. Skipping."
              continue
            fi
            ISSUE_STATE=$(printf '%s' "$ISSUE_JSON" | jq -r '.state // "unknown"' | tr '[:lower:]' '[:upper:]')
            if [ "$ISSUE_STATE" != "CLOSED" ]; then
              echo "Issue #$N is not closed (state=$ISSUE_STATE) -- the merge did not close it (base was '$PR_BASE_REF'; only the default branch auto-closes). Nothing orphaned; skipping."
              continue
            fi
            echo "Issue #$N confirmed CLOSED and is a real issue. ✓"

            # Filter: open PRs (excluding the merged PR) whose body contains a
            # closing-keyword reference to #N. Output: "<number> <headRefOid>" per match.
            # N is interpolated as a literal number in .number != N (numeric in JSON).
            # Strip backtick spans (gsub) before testing — this codebase's CLAUDE.md
            # recommends wrapping close-keyword examples in backticks to avoid parser
            # trips; without stripping, a PR that cites the convention would get a
            # false-positive failing gate here (unlike v1 where the result is only a
            # warning). Mirrors the sed stripping applied to the merged PR body above.
            ORPHANS=$(printf '%s' "$OPEN_PRS_JSON" | jq -r \
              '.[] |
               select(.number != '"$MERGED_PR"') |
               select(.body != null) |
               select((.body | gsub("`[^`]*`"; "")) | test("(close[sd]?|fix(es|ed)?|resolve[sd]?)[[:space:]]+#'"$N"'\\b"; "i")) |
               "\(.number) \(.headRefOid)"')

            if [ -z "$ORPHANS" ]; then
              echo "No orphaned PRs found for #$N."
              continue
            fi

            while IFS= read -r line; do
              read -r ORPHAN_NUM ORPHAN_SHA <<< "$line"

              echo "Orphaned PR found: #$ORPHAN_NUM (sha=$ORPHAN_SHA) -- targets #$N which is now closed."

              # ── Post failing check-run on orphaned PR's head commit ─────────
              # Use --field flags rather than --input to avoid heredoc YAML issues.
              # `|| true` (#2366): this workflow's own closing contract is
              # "always exit 0, informational + retroactive, never fail the
              # triggering PR" -- but a bare `VAR=$(cmd)` takes cmd's exit
              # status, and this step runs under Actions' default `bash -e`.
              # An API failure here would terminate the whole step, silently
              # skipping every remaining orphan in the loop and never reaching
              # the `else` branch below that exists specifically to report it.
              # Content-based dispatch (grep for `"id":`) is UNCHANGED and
              # deliberately preserved -- this file's own hard-won lesson
              # above is that `gh api` can print an error body to stdout on
              # failure, so checking exit status instead here would be a
              # regression, not an improvement.
              CHECK_RESULT=$(gh api --method POST "repos/$REPO/check-runs" \
                --field name="anti-dup" \
                --field head_sha="$ORPHAN_SHA" \
                --field status="completed" \
                --field conclusion="failure" \
                --field output[title]="Duplicate PR -- target issue #$N now closed" \
                --field output[summary]="PR #$MERGED_PR merged and closed issue #$N. This PR also targets #$N with a closing keyword and is now a duplicate. Options: (1) If this PR supersedes the merged fix, reopen issue #$N and explain the distinction in this PR description. (2) If this PR duplicates the merged fix, close it." \
                2>&1) || true
              if printf '%s' "$CHECK_RESULT" | grep -q '"id":[[:space:]]*[0-9]'; then
                echo "  check-run posted on #$ORPHAN_NUM: OK"
              else
                echo "  check-run on #$ORPHAN_NUM: FAILED -- $CHECK_RESULT"
              fi

              # ── Post PR comment for visibility ──────────────────────────────
              # Check-run annotations alone are easy to miss; a comment ensures
              # the author gets a notification.
              COMMENT=$(printf \
                '**Duplicate PR detected (anti-dup-retro-check)**\n\nPR #%s merged and closed issue #%s. This PR also references #%s with a closing keyword and is now orphaned.\n\n**Options:**\n- If this PR supersedes or extends the merged fix, reopen issue #%s and update this PR description to explain the distinction.\n- If this PR duplicates the merged fix, close it.\n\n*(Posted by the anti-dup-retro-check workflow.)*' \
                "$MERGED_PR" "$N" "$N" "$N")

              # #2366: same errexit trap as CHECK_RESULT above, plus a second
              # subtlety a bare `|| true` here would introduce -- this
              # dispatch is EXIT-CODE-based (`[ $? -eq 0 ]`), not
              # content-based, so appending `|| true` to the assignment
              # would force $? to 0 unconditionally and make every failure
              # print as "OK". Restructuring as the condition of `if` (a
              # documented `set -e` exemption, and the same safe pattern
              # this file already uses for ISSUE_JSON above) captures the
              # real exit status without ever exposing it to errexit.
              if COMMENT_RESULT=$(gh pr comment "$ORPHAN_NUM" --repo "$REPO" \
                --body "$COMMENT" 2>&1); then
                echo "  comment posted on #$ORPHAN_NUM: OK"
              else
                echo "  comment on #$ORPHAN_NUM: FAILED -- $COMMENT_RESULT"
              fi

            done <<< "$ORPHANS"
          done

          # Always exit 0 — this workflow is informational + retroactive.
          # It should not fail the triggering (already-merged) PR.
          echo ""
          echo "Retro-check complete."
          exit 0
