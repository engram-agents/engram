name: name-leak-gate

# Issue #4429 — the name-leak gate must not fail open, and it must not report a
# green tick for a scan that never ran.
#
# The advisory inline comment in pr-checks.yml stays (same-repo PRs get it).
# This workflow is the blocking surface:
#
#   * pull_request, head repo == this repo  -> the gate runs with the secret.
#     Success needs the roster AND a matching coverage attestation.
#   * pull_request from a fork               -> FAILS with a status name that
#     contains the literal token "NOT SCANNED" (the secret never reaches a
#     fork, so the gate cannot run there). Same-repo branches are the
#     supported path for outside contributions: re-push the fork branch into
#     this repository so the gate runs before merge.
#   * push to the default branch (dev)       -> post-merge backstop. Fails
#     loud AND files an issue when the roster is missing or the attestation
#     does not match, so a red cannot go unnoticed.
#
# `pull_request_target` is FORBIDDEN here: it would hand the roster secret to
# contributor-controlled code. Measured: zero uses in this repo; keep it zero.
#
# The decision itself is the pure function in tools/name_leak_gate.py. The
# harness below performs all I/O and hands it five facts. The job's display
# name is the status name the contract returns, and the decide step asserts the
# two agree so they cannot drift.
#
# Required-check note: the ruleset owner may require `name-leak-gate`. The
# fork variant `name-leak-gate (NOT SCANNED - fork PR)` must NEVER be listed as
# a required check.

on:
  push:
    # Default branch only. The repo's default is `dev` (CLAUDE.md "Branching
    # convention"); update this filter if the default branch ever moves.
    branches: [dev]
  pull_request:
    # `edited` is load-bearing, not a convenience. What this workflow scans is
    # `git diff "$BASE_SHA"...HEAD` — the pull request's diff — so a base-branch
    # retarget replaces the entire subject of the scan. Without `edited` the
    # gate does not re-run, and the previous run's success stays attached to the
    # head commit: check runs bind to the commit, not to the base. The status
    # list then shows a green tick describing a diff that no longer exists. That
    # is the same false tick this file's header (#4429) exists to forbid, via a
    # route the header did not name.
    #
    # The job-level `if` below keeps a title or body edit from buying a runner
    # start: `edited` fires for those too, and only a base change invalidates
    # the previous run.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  name-leak-gate:
    # The status context a reviewer sees. Fork PRs get the distinct name that
    # says the gate did not run; the token is load-bearing.
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'name-leak-gate (NOT SCANNED - fork PR)' || 'name-leak-gate' }}
    # NO job-level `if:` here, deliberately, and do not add one to save a run.
    #
    # `edited` also fires for a title or body change, so it is tempting to skip
    # everything except a base move. That skip is a false tick. A skipped job
    # still reports under this job's `name`, with conclusion `skipped`, and
    # check runs key on the HEAD COMMIT — so the skip SUPERSEDES the previous
    # run on the same head rather than sitting beside it. Measured on
    # engram-agents/ci-probes#6 at head 1f7aacfe: two failing runs and then a
    # title edit, after which `gh pr checks` showed one line, `name-leak-gate
    # skipping`, and both reds had disappeared from the pull request's check
    # list. A red gate that a typo fix in the title turns grey is the same
    # failure this file exists to prevent, reached by a third route.
    #
    # Running on every `edited` re-scans the current base...head diff and
    # reproduces the true verdict, so it can neither mask a red nor invent a
    # green. The cost is one runner start per title or body edit, about 11
    # seconds of wall time. It is not a billing cost: this repository is
    # public, so standard Actions minutes are free.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Post-merge backstop only: open/comment/close the failure issue.
      # Fork PR runs get a read-only token by platform rule and file nothing.
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The push backstop diffs github.event.before..github.event.after, so
          # the pre-push tip must be present in the clone.
          fetch-depth: 0

      # ── the one decision point ───────────────────────────────────────────
      # All I/O happens here (secret, roster canonicalisation, sha256,
      # attestation read); tools/name_leak_gate.py is pure and imports nothing
      # that could touch the environment.
      - name: decide the gate verdict
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository || false }}
          EXPECTED_STATUS_NAME: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'name-leak-gate (NOT SCANNED - fork PR)' || 'name-leak-gate' }}
          NAME_LEAK_ROSTER: ${{ secrets.NAME_LEAK_ROSTER }}
          ATTESTATION_PATH: .github/name-leak-roster.attestation.json
          # The tree the gate's OWN CODE is read from. On a pull request that
          # is the base commit, which the contributor cannot write; on a push it
          # is the pushed commit, which only a writer could have made.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          # Second link of the fallback chain: a protected branch that carries
          # the tool once it has merged, so a pull request into `main` (whose
          # base predates the tool) does not sit on the bootstrap path forever.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # `-P`: do not prepend the cwd (or the script's directory) to
          # sys.path. Measured: without it `sys.path[0]` is `''` for a `-`
          # script, so a `json.py` committed at the repository root is imported
          # in place of the standard library one — in this step, with the roster
          # in the environment. With `-P` the import resolves to the stdlib.
          python3 -P - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          import re
          import subprocess
          import tempfile

          event = os.environ.get("EVENT_NAME", "")
          is_fork = os.environ.get("PR_IS_FORK", "false").strip().lower() == "true"

          raw = os.environ.get("NAME_LEAK_ROSTER", "")
          roster_present = bool(raw.strip())

          # Canonical roster text: ALL trailing newlines stripped and exactly
          # one appended, so the attested sha256 is reproducible from any copy
          # of the roster with the canonicalising one-liner documented in
          # docs/internal/name-leak-gate-trusted-run.md. A plain `sha256sum`
          # only agrees when the file already ends in exactly one newline.
          # HASH THE WHOLE FILE, never per pattern: a per-pattern hash would be
          # a membership oracle (a candidate name can be hashed and checked
          # against it).
          canonical = (raw.rstrip("\n") + "\n") if roster_present else ""
          # The roster is a SECRET ON DISK, so it gets a private location, not a
          # fixed one. A fixed path is wrong twice over: on a shared host the
          # name is already taken by another user's file (so this step cannot
          # write it), and a predictable world-readable path hands the roster to
          # every account on the machine. `mkdtemp` creates the directory 0700;
          # the file is created 0600 by open(2) rather than chmod'd afterwards,
          # so there is no window in which it is readable.
          run_dir = tempfile.mkdtemp(dir=os.environ.get("RUNNER_TEMP") or None)
          roster_path = os.path.join(run_dir, "roster.txt")
          _fd = os.open(roster_path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(_fd, "w", encoding="utf-8") as fh:
              fh.write(canonical)
          actual_sha = (
              hashlib.sha256(canonical.encode("utf-8")).hexdigest()
              if roster_present
              else ""
          )
          pattern_count = (
              sum(
                  1
                  for line in canonical.splitlines()
                  if line.strip() and not line.strip().startswith("#")
              )
              if roster_present
              else 0
          )

          # Validate every roster pattern HERE, before any scan step can run.
          # tools/name_leak_warn.py prints the offending pattern text to stderr
          # on an invalid pattern, and this workflow does not redirect it, so an
          # unvalidated roster could echo one line into the CI log. Validating
          # first makes that path unreachable: on failure this step prints the
          # LINE NUMBER only and fails. Never print the pattern text.
          invalid_pattern_line = None
          for lineno, line in enumerate(canonical.splitlines(), start=1):
              stripped = line.strip()
              if not stripped or stripped.startswith("#"):
                  continue
              try:
                  re.compile(stripped)
              except re.error:
                  invalid_pattern_line = lineno
                  break
          if invalid_pattern_line is not None:
              print(
                  "::error::NAME_LEAK_ROSTER line "
                  f"{invalid_pattern_line} is not a valid regular expression. "
                  "Fix the secret; the pattern text is deliberately not printed."
              )
              raise SystemExit(1)

          attestation_present = False
          attestation_matches = False
          attested_count = None
          try:
              with open(os.environ["ATTESTATION_PATH"], encoding="utf-8") as fh:
                  attestation = json.load(fh)
          except (OSError, ValueError):
              attestation = None

          if isinstance(attestation, dict):
              attested_count = attestation.get("pattern_count")
              attested_sha = attestation.get("roster_sha256")
              # A valid attestation has schema 1, an integer pattern count and
              # a 64-hex whole-file sha256. Anything else is "not present": a
              # malformed or unset attestation must fail, never pass.
              if (
                  attestation.get("roster_format") == 1
                  and isinstance(attested_count, int)
                  and isinstance(attested_sha, str)
                  and re.fullmatch(r"[0-9a-f]{64}", attested_sha) is not None
              ):
                  attestation_present = True
                  attestation_matches = attested_sha == actual_sha

          # Execute the gate's code from a tree the PR author cannot write, never
          # from the pull request's checkout. On a same-repo pull request the
          # branch is contributor-controlled, and this step is the one holding
          # the roster; running the branch's `tools/name_leak_gate.py` would hand
          # the secret to code the PR author wrote. The branch contributes DATA
          # only — its diff and its attestation.
          #
          # The chain has THREE links, and the third is why the second exists.
          # The base commit alone is not enough: this workflow runs on every
          # `pull_request` with no branch filter, so a PR into `main` (release
          # cuts, hotfixes) has a base that does not carry the tool yet, and
          # would take the bootstrap branch FOREVER rather than until the first
          # merge. Measured 2026-11-07: the tool is absent on `main` (69894967).
          # So after the base, try the default branch, which is ruleset
          # protected. Only when NEITHER has the tool is the PR's own copy used,
          # and that is loud.
          tool_src = "tools/name_leak_gate.py"
          base_sha = os.environ["BASE_SHA"]
          default_branch = os.environ.get("DEFAULT_BRANCH", "dev")

          # Do not rely on what `fetch-depth: 0` happened to bring in: ask for
          # the default branch explicitly. `check=False` because the outcome is
          # judged below by whether the ref RESOLVES, not by this exit code — a
          # fetch that fails after the objects are already present is harmless,
          # and a fetch that fails leaving nothing is caught as a hard failure
          # rather than being read as "the branch has no tool".
          subprocess.run(
              ["git", "fetch", "--no-tags", "origin", default_branch],
              check=False,
              capture_output=True,
          )

          def _blob_from(ref):
              return subprocess.run(
                  ["git", "show", f"{ref}:{tool_src}"],
                  check=True,
                  capture_output=True,
              ).stdout

          def _resolves(ref):
              """True only when `ref` names a commit this clone actually has."""
              return (
                  subprocess.run(
                      ["git", "cat-file", "-e", f"{ref}^{{commit}}"],
                      capture_output=True,
                  ).returncode
                  == 0
              )

          # POSITIVE KNOWLEDGE ONLY. The bootstrap branch may be entered only
          # when both protected refs RESOLVE and both lack the tool — that is a
          # fact about the trees. A ref that does not resolve is a different
          # fact: this clone cannot see it. Treating "cannot see" as "does not
          # have the file" is the fail-open shape this whole gate exists to
          # remove, and it would be reachable by a fetch failure alone.
          default_ref = f"origin/{default_branch}"
          for ref in (base_sha, default_ref):
              if not _resolves(ref):
                  print(
                      f"::error::name-leak gate: {ref} does not resolve in this "
                      "clone, so the gate cannot prove its own code came from a "
                      "protected tree. Failing closed — it will NOT fall back "
                      "to the pull request's copy on a ref it cannot read."
                  )
                  raise SystemExit(1)

          code_bytes = None
          code_source = None
          for ref in (base_sha, default_ref):
              try:
                  code_bytes = _blob_from(ref)
                  code_source = ref
                  break
              except subprocess.CalledProcessError:
                  continue

          loaded_from_base = code_bytes is not None
          if code_bytes is None:
              # BOOTSTRAP ONLY, and now by positive knowledge: both protected
              # refs resolved, and neither carries the tool. That is true only
              # before the gate first merges onto the default branch, because a
              # protected branch can never LOSE a merged file. Loud, never
              # silent.
              code_source = "pull request checkout (BOOTSTRAP)"
              try:
                  with open(tool_src, "rb") as fh:
                      code_bytes = fh.read()
              except OSError as exc:
                  # Neither protected ref has the tool AND the checkout does not
                  # either. There is nothing to run, so say so instead of
                  # letting a traceback stand in for a verdict.
                  print(
                      "::error::name-leak gate: neither the base commit nor "
                      f"{default_ref} carries {tool_src}, and the pull "
                      f"request's checkout has no copy either "
                      f"({exc.__class__.__name__}). Failing closed."
                  )
                  raise SystemExit(1)
              print(
                  "::warning::BOOTSTRAP: the gate tool is absent from both "
                  f"{base_sha} and origin/{default_branch}, so this run "
                  "executes the pull request's own copy. This is possible only "
                  "before the gate first merges onto the default branch."
              )

          gate_path = os.path.join(
              os.environ.get("RUNNER_TEMP", "/tmp"), "name_leak_gate_base.py"
          )
          with open(gate_path, "wb") as fh:
              fh.write(code_bytes)
          spec = importlib.util.spec_from_file_location("name_leak_gate", gate_path)
          gate = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gate)

          outcome = gate.decide(
              event, is_fork, roster_present, attestation_present, attestation_matches
          )

          expected_status = os.environ.get("EXPECTED_STATUS_NAME", gate.STATUS_SCANNED)
          if outcome.status_name != expected_status:
              print(
                  "::error::status-name drift: the contract returns "
                  f"{outcome.status_name!r} but this workflow emits "
                  f"{expected_status!r}"
              )
              raise SystemExit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"conclusion={outcome.conclusion}\n")
              fh.write(f"status_name={outcome.status_name}\n")
              fh.write(f"reason={outcome.reason}\n")
              fh.write(f"pattern_count={pattern_count}\n")
              fh.write(f"roster_sha256={actual_sha}\n")
              fh.write(f"loaded_from_base={loaded_from_base}\n")
              fh.write(f"gate_code_source={code_source}\n")
              fh.write(f"run_dir={run_dir}\n")
              fh.write(f"roster_path={roster_path}\n")

          # Only when the hash matched: the text below says "still matched", so
          # on a mismatch it would contradict the verdict (#4600).
          if (
              roster_present
              and attestation_present
              and attestation_matches
              and attested_count != pattern_count
          ):
              print(
                  f"::warning::the attestation records {attested_count} pattern(s) "
                  f"but the roster has {pattern_count}; the sha256 still matched"
              )

          print(
              f"name-leak gate: {outcome.conclusion} — {outcome.reason} "
              f"(status {outcome.status_name!r}; code read from {code_source})"
          )

          # Diagnostic, attestation-mismatch failure path only. These values are
          # PUBLIC BY DESIGN: the whole-file sha256 is exactly what the committed
          # attestation exists to publish, so a reader filling or rotating the
          # attestation can copy it straight from this log. NEVER print the
          # roster, a pattern, or any substring of one. Kept off the green path
          # so a passing run stays quiet, and off every other failure path
          # (fork, unknown event, roster absent) because none of them has a
          # digest to offer.
          if (
              outcome.conclusion == gate.FAILURE
              and event in gate.TRUSTED_EVENTS
              and not is_fork
              and roster_present
              and not attestation_matches
          ):
              attestation_expected = (
                  attested_sha if attestation_present else "absent"
              )
              print(
                  "name-leak gate diagnostic: attestation absent or mismatched"
              )
              print(f"roster_sha256={actual_sha}")
              print(f"pattern_count={pattern_count}")
              print(f"attestation_expected={attestation_expected}")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(f"### name-leak gate: {outcome.conclusion}\n\n")
              fh.write(f"- event: `{event}`\n")
              fh.write(f"- status: `{outcome.status_name}`\n")
              fh.write(f"- reason: {outcome.reason}\n")
              fh.write(f"- roster present: `{roster_present}`\n")
              fh.write(
                  f"- attestation present: `{attestation_present}`, matches: "
                  f"`{attestation_matches}`\n"
              )
              fh.write(f"- patterns: `{pattern_count}`\n")
              fh.write(f"- roster sha256: `{actual_sha or 'n/a'}` (whole file)\n")
              fh.write(f"- gate code read from base: `{loaded_from_base}`\n")
              fh.write(f"- gate code source: `{code_source}`\n")
          PY

      # ── post-merge backstop: scan the pushed range ───────────────────────
      # Only a push on the default branch has a range to scan. Matches are
      # REPORTED, not failed on: the failure contract is about the gate being
      # able to run at all (roster present, attestation matched). A match is
      # the advisory surface's business, and it stays visible here.
      - name: scan the pushed range against the roster
        if: ${{ !cancelled() && github.event_name == 'push' && steps.decide.outputs.conclusion == 'success' }}
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          PATTERN_COUNT: ${{ steps.decide.outputs.pattern_count }}
          BASE_SHA: ${{ github.sha }}
          RUN_DIR: ${{ steps.decide.outputs.run_dir }}
          ROSTER_PATH: ${{ steps.decide.outputs.roster_path }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::name-leak gate: push base ${BEFORE_SHA} is not a commit in this clone, so the scan range cannot be bounded. Failing closed."
            exit 1
          fi
          # The scanner runs from the base commit's copy, not the checkout's,
          # for the same reason the decide step does: the roster file is on disk
          # in this job, and the branch's copy of the scanner could read it.
          # `-P` keeps the checkout off sys.path. Both measured; see the doc.
          # Every path here is per-run: nothing touches a fixed /tmp name.
          git show "${BASE_SHA}:tools/name_leak_warn.py" > "${RUN_DIR}/name_leak_warn_base.py"
          git diff "$BEFORE_SHA" "$AFTER_SHA" > "${RUN_DIR}/push.diff"
          python3 -P "${RUN_DIR}/name_leak_warn_base.py" \
            --roster-file "$ROSTER_PATH" \
            --diff-file "${RUN_DIR}/push.diff" \
            --format json > "${RUN_DIR}/result.json"
          MATCH_COUNT="$(python3 -P -c "import json,sys;print(len(json.load(open(sys.argv[1]))['matches']))" "${RUN_DIR}/result.json")"
          echo "name-leak gate scanned ${BEFORE_SHA}..${AFTER_SHA}: ${PATTERN_COUNT} pattern(s), ${MATCH_COUNT} match(es)."
          {
            echo ""
            echo "### name-leak scan"
            echo ""
            echo "- range: \`${BEFORE_SHA}..${AFTER_SHA}\`"
            echo "- patterns: ${PATTERN_COUNT}"
            echo "- matches: ${MATCH_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── pull request: scan the PR diff ───────────────────────────────────
      # A green `name-leak-gate` on a same-repo PR must mean the diff WAS
      # examined against the roster, not merely that the decision executed.
      # The match count is REPORTED and never failed on: Lei's ruling makes the
      # name check advisory, so a match does not change the conclusion and does
      # not make this check red. A scan that cannot run, by contrast, is a loud
      # failure - never a green tick for an unexamined diff.
      # The inline PR comment carrying the individual matches stays the job of
      # the advisory `name-leak-warn` step in pr-checks.yml; this step reports
      # counts only.
      - name: scan the pull request diff against the roster
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.decide.outputs.conclusion == 'success' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PATTERN_COUNT: ${{ steps.decide.outputs.pattern_count }}
          RUN_DIR: ${{ steps.decide.outputs.run_dir }}
          ROSTER_PATH: ${{ steps.decide.outputs.roster_path }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::name-leak gate: pull request base ${BASE_SHA} is not a commit in this clone, so the scan range cannot be bounded. Failing closed."
            exit 1
          fi
          # Three-dot form: diff from the merge base to the checked-out ref, so
          # this is the PR's own change set and not the base branch's advances.
          git diff "${BASE_SHA}"...HEAD > "${RUN_DIR}/pr.diff"
          # Scanner from the base commit, `-P` to keep the checkout off
          # sys.path — same two reasons as the push step above.
          git show "${BASE_SHA}:tools/name_leak_warn.py" > "${RUN_DIR}/name_leak_warn_base.py"
          python3 -P "${RUN_DIR}/name_leak_warn_base.py" \
            --roster-file "$ROSTER_PATH" \
            --diff-file "${RUN_DIR}/pr.diff" \
            --format json > "${RUN_DIR}/pr-result.json"
          MATCH_COUNT="$(python3 -P -c "import json,sys;print(len(json.load(open(sys.argv[1]))['matches']))" "${RUN_DIR}/pr-result.json")"
          echo "name-leak gate scanned the pull request diff (${BASE_SHA}...HEAD): ${PATTERN_COUNT} pattern(s), ${MATCH_COUNT} match(es)."
          {
            echo ""
            echo "### name-leak scan (pull request)"
            echo ""
            echo "- range: \`${BASE_SHA}...HEAD\`"
            echo "- patterns: ${PATTERN_COUNT}"
            echo "- matches: ${MATCH_COUNT} (reported, not blocking)"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── post-merge backstop: a red must not go unnoticed ─────────────────
      # Same shape as nightly.yml's ci-nightly notify steps: idempotent label,
      # one open issue, comment when it exists, create when it does not, and
      # close it on the next green run. A distinct label keeps this surface
      # from colliding with nightly's ci-nightly issue (one green nightly must
      # not close an open name-leak failure, and vice versa).
      - name: ensure the name-leak-gate label exists
        if: ${{ !cancelled() && github.event_name == 'push' && (failure() || steps.decide.outputs.conclusion == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh label create name-leak-gate --description "name-leak gate failure tracking" --color B60205 --force

      - name: on failure — open or update the name-leak-gate issue
        if: ${{ !cancelled() && github.event_name == 'push' && (failure() || steps.decide.outputs.conclusion == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          set -e
          DATE="$(date -u +%Y-%m-%d)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DECISION="${{ steps.decide.outputs.conclusion }}"
          if [ "$DECISION" = "success" ]; then
            # The decision passed but a later step (the scan) failed, so the
            # decide-step reason would describe the wrong problem.
            REASON_TEXT="a step after the decision failed (likely the scan); see the run log"
          else
            REASON_TEXT="${REASON:-the decision step failed before producing a verdict}"
          fi
          BODY="The post-merge name-leak gate failed on a push to the default branch: ${RUN_URL}

          Reason: ${REASON_TEXT}

          The name-leak gate is NOT running on \`dev\` until this is green.
          Check the \`NAME_LEAK_ROSTER\` secret and \`.github/name-leak-roster.attestation.json\`
          (its \`roster_sha256\` is the sha256 of the WHOLE roster file, never per pattern).
          See \`docs/internal/name-leak-gate-trusted-run.md\`."
          EXISTING="$(gh issue list --label name-leak-gate --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "name-leak gate failure — ${DATE}" \
              --label name-leak-gate \
              --body "$BODY"
          fi

      - name: on success — close any open name-leak-gate issue
        if: ${{ !cancelled() && success() && github.event_name == 'push' && steps.decide.outputs.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          DATE="$(date -u +%Y-%m-%d)"
          EXISTING="$(gh issue list --label name-leak-gate --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "green on ${DATE}"
            gh issue close "$EXISTING"
          fi

      # ── the verdict becomes the job's conclusion ─────────────────────────
      # Runs last so the issue above is filed before the job turns red.
      # `!cancelled()` opts out of the implicit success() so this still runs
      # after the failure-notification steps.
      - name: fail the check when the contract says failure
        if: ${{ !cancelled() && (steps.decide.outcome == 'failure' || steps.decide.outputs.conclusion == 'failure') }}
        env:
          REASON: ${{ steps.decide.outputs.reason }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository || false }}
        run: |
          if [ "$IS_FORK" = "true" ]; then
            echo "::error::The name-leak gate did NOT scan this pull request: not scanned, roster unavailable. Fork PRs never receive the roster secret. Re-push the branch into this repository (a same-repo branch) so the gate runs with the roster before merge. See docs/internal/name-leak-gate-trusted-run.md."
          else
            echo "::error::name-leak gate FAILED: ${REASON:-the decision step failed before producing a verdict}"
          fi
          exit 1
