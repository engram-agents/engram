name: pr-checks

# Combined per-PR scrub checks (#1597) — one job, one runner, N sequential steps.
# Previously six separate workflows; the cost saving is 5 fewer runner startups
# per PR. Faithful preservation: each check's logic is unchanged — only
# runner-setup overhead is reduced.
#
# Checks in order (preserved from their individual workflow files):
#   1. anti-dup              (was anti-dup-check.yml)
#   2. no-new-shipped-node-ids   (was check-no-new-shipped-node-ids.yml)
#   3. pr-body-close-keyword     (was check-pr-body-close-keyword.yml)
#   4. name-leak-warn            (was name-leak-warn.yml — advisory, never blocks job)
#   5. stray-master-ref-check    (#1884 — advisory, never blocks job)
#   5b. stray-baton-path-check  (#2316 — advisory, never blocks job)
#   6. invariant-checks          (was invariant-checks.yml — used to run Python 3.11)
#   7. manifest-gate             (was manifest-gate.yml — Python 3.12)
#   7b. artifact-drift guards    (#2340 — tool-capability-index +
#      instruction-manifestation pilots; same staleness-by-omission class as
#      manifest-gate's tiers.json check, but ran in no workflow until now.
#      The capability-index half is path-gated — unlike prior-art #2371,
#      which installed fastmcp unconditionally and was parked on that cost.)
#   7c. stdlib-only guards      (#2376 — 5 SSoT/sync/drift gates measured to need
#      nothing beyond stdlib+pytest, same carve-out as manifest-gate above)
#   8. test-id-set-check         (#2350 — BLOCKING; a deleted test cannot fail, so a
#      PR that removes coverage is exactly as green as a PR that adds it)
#   8b. test-id-set-check-unit-tests (#2950/#2959 — BLOCKING; runs
#      tests/test_test_id_set_check.py itself, including the TEST_SCAN_ROOTS
#      <-> tests.yml sync gate — this repo's dev-PR gate previously ran ONLY
#      the tool invocation above (step 8), never its own test suite, so a
#      regression to the sync gate (or to the parser it depends on) was
#      invisible until the dev->main release cut. Same shape as
#      hooks-stdout-audit below: a gate positioned outside the path where
#      the decision is made cannot protect the thing it audits.)
#   9. hooks-stdout-audit         (#2718 — BLOCKING when the diff touches
#      src/engram/hooks/ or hooks.json, self-skips otherwise; the audit
#      (tests/test_hooks_json_stdout_audit.py) previously ran ONLY in the
#      nightly full suite, so a plaintext-stdout regression to a shipped
#      hook (#2700) went green through pr-checks and broke hours later in
#      a nightly nobody watches live (#2717). Path-scoped so it does not
#      reintroduce full-suite cost on every PR.)
#   10. team-practice-drift-gate  (umwelt#811 — ADVISORY until a cross-repo
#      read credential exists, matching the established remedy for this
#      exact defect class on exam-room#23/#24 — checks out
#      engram-agents/team-practice and runs its sync_team_practice.py
#      --check against this repo's CLAUDE.md. A hand-edit inside a
#      generated `<!-- BEGIN team-practice: ... -->` region is the drift
#      this exists to catch — the whole reason for generated regions
#      instead of the old hand-duplicated-across-repos convention. One
#      block migrated so far (which-colleague-takes-the-seat); more move
#      in follow-up PRs. Default GITHUB_TOKEN cannot read a private
#      sibling repo in this org (measured, not assumed — matches
#      exam-room#23's identical finding); mira-verala's exam-room#24
#      recommendation (a dedicated org-owned GitHub App, Contents:
#      Read-only, installed on team-practice only) is the credential this
#      step is waiting on. `continue-on-error` on the checkout keeps this
#      advisory (a loud ::warning::, never a silent pass) until then, so
#      it does not block every PR to this repo on an org-admin item.)
#   11. check-stubbed-signatures  (#3118 — BLOCKING; a signature change to a
#      function stubbed BY BARE NAME in a test (monkeypatch.setattr, or a
#      removed stdlib-transport call a stub relies on going away) is
#      invisible to tools/run_touched_tests.py's import-graph +
#      convention-map selection, which resolves by import/path, never by the
#      bare names a stub binds. #3110 changed _fetch_threads/_fetch_inbox's
#      signatures and moved a POST call off urlopen onto http.client; the
#      two test files stubbing those exact names were never selected by the
#      hand-picked "affected tests" list and the gap was only caught when
#      the full suite ran on the release PR. tools/check_stubbed_signatures.py
#      is additive, not a replacement for run_touched_tests.py — see that
#      tool's own module docstring.)

on:
  pull_request:
    # `edited` (#2361): the test-id-set-check names a remedy — add a
    # `Removed-test:` line to the PR body — that the workflow could not
    # observe without it. A body edit fires `edited`, which was absent, and a
    # manual re-run replays the ORIGINAL event payload (measured), so the only
    # remedy the gate named was invisible to the gate. It also starts a run
    # when GitHub auto-retargets a stacked PR to dev (addresses #2344).
    # `edited` cannot be filtered to body-only, so this also fires on title
    # edits; pr-checks is one combined job of static scrubs and the runner
    # cost of that is accepted deliberately (Kepler's call, #2361).
    types: [opened, reopened, synchronize, edited]
    # NO `branches:` FILTER, deliberately (#2361). The filter matches the BASE
    # branch, so `[dev, main]` meant a PR stacked onto a sibling feature branch
    # ran none of these scrubs — exactly the long-lived stack where an
    # intermediate round can drop a test id and nothing re-counts until the
    # stack bottom retargets. Do not re-add a base filter without re-reading
    # that issue; the stacked case is the one these gates most need to cover.

# One in-flight run per PR (#2361 review). `edited` raises trigger frequency --
# every title or body edit now starts a run -- which widens a pre-existing race
# in the name-leak-warn step: it upserts a PR comment by list-then-create/update,
# so two overlapping runs can both read "no comment yet" and both create one.
# Cancelling the superseded run also stops paying for scrub results nobody reads.
# NOT cancel-in-progress on the merge queue's behalf -- this keys on the PR ref,
# so it cannot cancel a run belonging to a different PR.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read        # name-leak-warn (checkout) + general
      issues: read          # anti-dup
      pull-requests: write  # name-leak-warn (PR comment); supersedes anti-dup's read
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 needed by no-new-shipped-node-ids and name-leak-warn
          # for base-branch diff; harmless for checks that don't use history.
          # fetch-tags: true (#2563 Gap 3) — the health-version tag-diff gate
          # below enumerates refs/tags/v* + refs/tags/deploy/* via
          # `git for-each-ref`, so the runner's checkout must actually carry
          # tag objects. This job has one shared checkout for all its steps
          # (pr-checks is a single combined job, see header); adding
          # fetch-tags here is a one-line change that covers every step,
          # rather than a second checkout scoped to this one gate.
          fetch-depth: 0
          fetch-tags: true

      # ── 1. anti-dup ────────────────────────────────────────────────────
      # (from anti-dup-check.yml)
      # Issue #1433 — mechanical gate against duplicate-effort PRs.
      # Problem: discipline-only pre-checks failed under high-parallelism async
      # work (5+ duplicate-PR collisions on 2026-06-25 despite the convention
      # adopted the previous day). Two cases this gate catches:
      #
      #   1. Target issue already CLOSED (sequential dup — opened after the
      #      first PR merged and auto-closed the issue). → FAIL hard.
      #   2. Another open PR already references the same issue with a closing
      #      keyword (parallel dup — two PRs racing on the same fix). → WARN.
      #
      # Scopes to closing keywords only (close/closes/closed, fix/fixes/fixed,
      # resolve/resolves/resolved) — EPIC/umbrella multi-PR flows that reference
      # an issue without a closing keyword are not flagged.
      #
      # Uses body-text grep (same as trap-check): GitHub's closingIssuesReferences
      # GraphQL field is dormant on stacked/non-default-base PRs.
      - name: anti-dup — check target issues for already-closed or competing open PRs
        if: success() || failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          # Strip inline-code spans before grepping — GitHub's auto-close parser
          # ignores keywords inside backticks (verified #1191), and CLAUDE.md
          # recommends backticking close-keyword examples to avoid parser trips.
          # Without stripping, a backtick-wrapped example (e.g. `closes #N`)
          # would false-hard-fail this gate even though GitHub won't act on it.
          BODY_STRIPPED=$(printf '%s' "$PR_BODY" | sed 's/`[^`]*`//g')

          # Extract issue numbers referenced with a closing keyword in the body.
          CLOSING_NS=$(printf '%s' "$BODY_STRIPPED" \
            | grep -ioE '(close[sd]?|fix(es|ed)?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' | sort -u)

          if [ -z "$CLOSING_NS" ]; then
            echo "No closing-keyword issue references in the PR body. ✓"
            exit 0
          fi

          HARD_FAIL=0

          for N in $CLOSING_NS; do
            # ── Check 1: Is the target issue already CLOSED? ──────────────────
            STATE=$(gh issue view "$N" --repo "$REPO" --json state \
              --jq '.state' 2>/dev/null || echo "unknown")
            if [ "$STATE" = "CLOSED" ]; then
              echo "::error::Issue #$N is already CLOSED. This PR appears to be a duplicate — the issue was resolved by an earlier PR. Verify before continuing; if this PR supersedes the prior fix, reopen the issue first."
              HARD_FAIL=1
            elif [ "$STATE" = "unknown" ]; then
              echo "::warning::Could not fetch state for issue #$N (API error or issue not found). Manual check recommended."
            else
              echo "Issue #$N is open (state=$STATE). ✓"
            fi

            # ── Check 2: Another open PR already targets the same issue ───────
            # List open PRs, exclude this PR, grep body for a closing-keyword
            # reference to #N. (GraphQL closingIssuesReferences is dormant on
            # stacked PRs, so body-grep is the reliable signal.)
            # Note: we grep raw bodies here (not stripped) — over-flagging a
            # competing PR that backticks its keyword is a harmless warning;
            # the important accuracy is on the hard-fail Check-1 above.
            # Both $PR_NUMBER and $N are digit-only (extracted via grep [0-9]+),
            # so direct interpolation into the jq filter is safe (no injection risk).
            COMPETING=$(gh pr list --repo "$REPO" --state open \
              --json number,body \
              --jq '.[] | select(.number != '"$PR_NUMBER"') | select(.body != null) |
               select(.body | test("(close[sd]?|fix(es|ed)?|resolve[sd]?)[[:space:]]+#'"$N"'\\b"; "i")) |
               .number' 2>/dev/null | tr '\n' ' ' | xargs)
            if [ -n "$COMPETING" ]; then
              echo "::warning::Issue #$N already has open PR(s) with a closing keyword: $(printf '#%s ' $COMPETING). Check for duplicate effort. If this PR supersedes those, note it in the PR description."
            fi
          done

          if [ "$HARD_FAIL" = "1" ]; then
            echo ""
            echo "One or more target issues are already CLOSED. To proceed:"
            echo "  • If this PR genuinely differs from the merged fix, reopen the"
            echo "    issue and update the PR body to explain the distinction."
            echo "  • If this PR duplicates the merged fix, close it."
            exit 1
          fi

          echo "All closing-keyword targets are open. ✓"

      # ── 2. no-new-shipped-node-ids ─────────────────────────────────────
      # (from check-no-new-shipped-node-ids.yml)
      # Enforces the policy from issue #51 / DEVELOPMENT.md "Shipped files —
      # no concrete ENGRAM node IDs": PRs to dev or main must not ADD new
      # concrete ENGRAM node ID references (regex below) inside alpha-released
      # files. Existing references are grandfathered; the scrub of the existing
      # corpus happens incrementally in follow-up PRs to issue #51.
      - name: no-new-shipped-node-ids — fail on newly-added concrete ENGRAM node IDs in shipped files
        if: success() || failure()
        run: |
          BASE_REF="origin/${{ github.base_ref }}"
          # The pattern follows engram_ids.py's documented broad shape:
          # every TYPE_PREFIX in server.py is exactly two lowercase letters,
          # so `[a-z]{2}_\d{4,}` catches every current type AND future types
          # without per-add maintenance. Current TYPE_PREFIX set (server.py
          # ~628): ev, ob, pr, dv, th, ct, qu, ax, df, cj, gl, gt, fl, tk,
          # ls, pn, cs, ts. The broad form is restrictive enough in practice
          # (random text rarely matches `xx_NNNN+` boundaries).
          PATTERN='\b[a-z]{2}_[0-9]{4,}\b'

          # Allowlist scope rationale — the criterion is SHARED-SOURCE HYGIENE,
          # not build-bundling: a concrete node ID is install-private (every
          # install renumbers its own graph from scratch, per DEVELOPMENT.md
          # "Shipped files" / issue #51), so it resolves to nothing — or to an
          # unrelated node — for ANY reader of a shared or public repo,
          # regardless of whether the file in question ships inside a plugin
          # install. "Not bundled" is therefore not a reason on its own; each
          # exclusion below needs its own positive reason — most on the
          # hygiene axis; CHANGELOG.md and this file are excluded for the
          # unrelated reasons noted inline below.
          #   tests/, src/forum/tests/ — excluded for two DIFFERENT reasons,
          #     not one, and no claim here about the split between them:
          #     (a) some matches are synthetic fixture-payload data — an
          #     id-shaped string passed as example input, test-scenario
          #     data and never a citation, so nothing is offered to a
          #     reader as resolvable provenance; (b) some matches are
          #     genuine developer-graph citations in module docstrings
          #     naming the migration wave or design decision that produced
          #     the test — excluded on the SAME audience argument as the
          #     process docs above: the reader is an agent working this
          #     repo, not a general shared-repo reader.
          #   paper_draft/, active-work/ — ephemeral drafting/scratch
          #     surfaces; any node-ID text there is a working note for the
          #     author's own session, not a citation offered to a reader.
          #   docs/cycle/ — self-improvement-cycle process docs (charter,
          #     chronicle, review packages, dream-pass protocol). These are
          #     process artifacts whose whole value IS author-graph
          #     provenance — the record of which claim drove which decision —
          #     read by agents working the cycle who hold (or can resolve
          #     against) the graph the docs were written from. A dangling ID
          #     here is expected background for that audience, not a hollow
          #     citation offered to an uninformed reader.
          #   docs/handbook/ — dev-internal developer handbook (accuracy-pass
          #     reference docs assembled by agents auditing the substrate
          #     against their own graph, with observation- and derivation-
          #     level provenance citations throughout, e.g. 03-hooks.md).
          #     Same reasoning as cycle/: the IDs are load-bearing provenance
          #     for a reader who holds the graph, not a citation offered to a
          #     general shared-repo reader.
          #   README.md — currently carries no node-ID citations (the
          #     seed-graph example block went with the scatter installer's
          #     retirement in a1ddd75a); excluded pre-emptively in case a
          #     future rewrite reintroduces install-identical seed IDs,
          #     which would be install-state reference — an ID identical
          #     across every install — rather than developer provenance,
          #     a different and valid non-hygiene-problem argument from the
          #     insider-provenance one the bullets above use.
          #   CHANGELOG.md — historical record; scrub planned separately
          #   this workflow file — contains the pattern literally
          # IN scope (intentionally NOT excluded; flag if added to):
          #   skills/, agents/, hooks/, integrations/, output-styles/,
          #   templates/, SKILL.md, CLAUDE.md, USER_GUIDE.md, DEVELOPMENT.md,
          #   server.py and engram_*.py modules, tools/ (most of it).
          EXCLUDES=(
            ':(exclude)tests/'
            ':(exclude)src/forum/tests/'
            ':(exclude)paper_draft/'
            ':(exclude)active-work/'
            ':(exclude)docs/cycle/'
            ':(exclude)docs/handbook/'
            ':(exclude)README.md'
            ':(exclude)docs/CHANGELOG.md'
            ':(exclude).github/workflows/pr-checks.yml'
            # engram_ids.py is the schema-defining module for the node-ID regex.
            # Its doctests must use ≥4-digit IDs (matching \d{4,}) to be correct.
            # These are regex-illustration examples, not developer-graph citations.
            ':(exclude)src/engram/engram_ids.py'
            # engram_ids.py moved from root to src/engram/ in Phase 1 #1093;
            # root compat symlink removed in Phase 4. Only the src/ path is tracked.
            # ':(exclude)engram_ids.py' entry removed (dead after Phase 4).
          )

          # Capture lines ADDED in this PR (start with '+', skip diff headers
          # which start with '+++') that contain a concrete node ID. The
          # `|| true` swallows grep's exit 1 when nothing matches — the
          # check's verdict comes from $VIOLATIONS being empty vs non-empty,
          # not from grep's exit code (so an unmatched grep is a PASS, not
          # a workflow failure).
          DIFF=$(git diff --no-color "$BASE_REF...HEAD" -- "${EXCLUDES[@]}")
          VIOLATIONS=$(echo "$DIFF" | grep -E "^\+[^+].*${PATTERN}" || true)

          if [ -n "$VIOLATIONS" ]; then
            echo "::error::New concrete ENGRAM node IDs introduced in alpha-released files."
            echo ""
            echo "Issue #51 policy (DEVELOPMENT.md §Shipped files): concrete node"
            echo "IDs (regex: ${PATTERN}) reference the developer's graph, which"
            echo "doesn't exist in any user's install. Substitute with concept"
            echo "words; cite by claim, not by ID."
            echo ""
            echo "Lines added in this PR that trip the check:"
            echo "$VIOLATIONS"
            echo ""
            echo "If a citation is load-bearing, rephrase to describe the"
            echo "concept inline. If the file is legitimately allowlisted"
            echo "(seed-graph docs, historical changelog, fixtures), extend"
            echo "EXCLUDES in this workflow and explain why in the PR body."
            exit 1
          fi

          echo "No new concrete node-ID references introduced. ✓"

      # ── 3. pr-body-close-keyword ────────────────────────────────────────
      # (from check-pr-body-close-keyword.yml)
      # Issue #539 — structural enforcement of the project's PR-closure convention
      # (CLAUDE.md "PR — issue closure"; #572). GitHub's auto-close parser fires on
      # the PR BODY (not the title) and ignores negation, brackets, and backticks
      # ("does NOT close #N" still auto-closes #N). The #572 convention therefore
      # REQUIRES a legitimate `Closes #N.` in the body to fire auto-close for the
      # title's own target — so a fail-ANY-keyword gate is wrong (it would block
      # every correctly-closing PR). This gate is TRAP-DETECTION: it PASSES the
      # legitimate target-close and FAILS only an OFF-TARGET body close-keyword
      # (referencing #M != the title's [closes #N]) — the wrong-issue trap that hit
      # PR #516 ("does NOT close #510") and PR #537.
      # Spec: Borges #756 + Ariadne's review on #959; reconciles #539 with #572.
      #
      # Body-text grep is intentional: the GraphQL closingIssuesReferences field is
      # dormant ([]) on non-default-base/stacked PRs and would pass them vacuously
      # (verified on a stacked-PR review); the body regex works at creation time
      # regardless of base.
      - name: pr-body-close-keyword — fail on off-target close-keyword in the PR body
        if: success() || failure()
        env:
          # Title + body passed via env, NOT inline ${{ }} in run:, to avoid
          # shell injection from author-controlled content.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # The title's intended close target(s): the [closes #N] / [close #N] /
          # [closed #N] human-scan bracket form (GitHub's parser ignores it).
          # A PR may legitimately close several issues, so collect a set.
          TITLE_NS=$(printf '%s' "$PR_TITLE" \
            | grep -ioE '\[clos[a-z]*[[:space:]]+#[0-9]+\]' \
            | grep -oE '[0-9]+' | sort -u)

          # Body close-keyword references (raw — the parser ignores negation /
          # brackets / backticks, so we must too). Keywords: close/closes/closed,
          # fix/fixes/fixed, resolve/resolves/resolved, each followed by #<number>.
          BODY_MS=$(printf '%s' "$PR_BODY" \
            | grep -ioE '(close[sd]?|fix(es|ed)?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '#[0-9]+' | tr -d '#' | sort -u)

          if [ -z "$BODY_MS" ]; then
            echo "No close-keyword references in the PR body. ✓"
            exit 0
          fi

          # No title target → can't distinguish intended-close from trap.
          # Per Borges #756: WARN, don't hard-fail — may be a partial/EPIC slice
          # referencing an umbrella; the final PR in the series carries the title tag.
          if [ -z "$TITLE_NS" ]; then
            echo "::warning::PR body has close-keyword reference(s) [$(echo $BODY_MS | tr '\n' ' ')] but the title has no [closes #N] target."
            echo "If this is the PR that should close an issue, add [closes #N] to the title AND keep 'Closes #N.' in the body (the body keyword fires GitHub's auto-close; the title bracket is human-scan only)."
            echo "If it's a partial/EPIC slice that only references an umbrella issue, this is expected — warning only, not a failure."
            exit 0
          fi

          # Title target(s) present → any body #M not in the title's target set
          # is a TRAP. grep -vxF treats TITLE_NS as a newline-separated fixed-
          # string set; -v -x keeps body M's matching NONE of the targets (the
          # off-target traps). (A bare `for M in $BODY_MS` mis-splits the
          # newline-separated list, so use set-difference grep instead.)
          TRAPS=$(printf '%s\n' "$BODY_MS" | grep -vxF "$TITLE_NS" || true)

          if [ -n "$TRAPS" ]; then
            echo "::error::Off-target close-keyword in the PR body: $(printf '#%s ' $TRAPS) (the title's close target is $(printf '#%s ' $TITLE_NS))."
            echo ""
            echo "GitHub's auto-close parser ignores negation, brackets, and backticks, so a body close-keyword pointing at a NON-target issue auto-closes the WRONG issue on merge:"
            echo "  \"this PR does NOT close #M\"          -> still auto-closes #M"
            echo "  \"the scrub PR uses [closes #M]\"      -> still auto-closes #M"
            echo ""
            echo "The legitimate close for this PR's own target (the #N in the title's [closes #N]) passes — fix only the off-target reference(s). Paraphrase so no close-keyword precedes a non-target #number:"
            echo "  instead of: \"does NOT close #M\"               use: \"#M stays open — this is a partial slice\""
            echo "  instead of: \"the scrub PR uses [closes #M]\"   use: \"the scrub PR carries the close-tag for #M in its title\""
            exit 1
          fi

          echo "Body close-keyword(s) all match the title's close target #$(echo $TITLE_NS | tr '\n' ' '). Legitimate. ✓"

      # ── 4. name-leak-warn ──────────────────────────────────────────────
      # (from name-leak-warn.yml)
      # Warn-only gate: surface personal/agent name mentions newly added by a PR diff.
      # Job always exits success — this is an advisory gate, not a merge blocker.
      # The two scan/comment steps carry continue-on-error: true to preserve
      # that advisory behavior inside this combined job.
      #
      # Activation: an org/repo admin must set the NAME_LEAK_ROSTER secret (one-time
      # maintainer action). Until then the gate self-skips harmlessly. Fork PRs also
      # self-skip (secrets are unavailable in fork contexts).
      #
      # NAME_LEAK_ROSTER format: newline-separated regex patterns, applied as-written.
      # Authors encode their own word boundaries / case handling per pattern.
      # Example:
      #   \bAlice Example\b
      #   \bagentname-nick\b
      - name: name-leak-warn — check for name-leak roster secret
        id: roster-check
        if: success() || failure()
        run: |
          if [ -z "$NAME_LEAK_ROSTER" ]; then
            echo "NAME_LEAK_ROSTER not configured — name-leak warn-gate skipped" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NAME_LEAK_ROSTER: ${{ secrets.NAME_LEAK_ROSTER }}

      - name: name-leak-warn — compute diff and scan for name mentions
        if: (success() || failure()) && steps.roster-check.outputs.skip == 'false'
        id: scan
        continue-on-error: true
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff

          echo "$NAME_LEAK_ROSTER" > /tmp/roster.txt

          python3 tools/name_leak_warn.py \
            --roster-file /tmp/roster.txt \
            --diff-file /tmp/pr.diff \
            --format json > /tmp/scan_result.json

          # Count matches
          MATCH_COUNT=$(python3 -c "
          import json, sys
          data = json.load(open('/tmp/scan_result.json'))
          print(len(data.get('matches', [])))
          ")

          echo "match_count=$MATCH_COUNT" >> "$GITHUB_OUTPUT"
        env:
          NAME_LEAK_ROSTER: ${{ secrets.NAME_LEAK_ROSTER }}

      - name: name-leak-warn — post or update PR comment
        if: (success() || failure()) && steps.roster-check.outputs.skip == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MATCH_COUNT: ${{ steps.scan.outputs.match_count }}
        run: |
          MARKER="<!-- name-leak-warn -->"

          # Find existing comment with our marker (upsert — no spam on re-push)
          EXISTING_ID=$(gh api \
            repos/${{ github.repository }}/issues/${PR_NUMBER}/comments \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" \
            | head -1)

          if [ "$MATCH_COUNT" -gt 0 ]; then
            # Build comment body listing matches
            MATCHES_TEXT=$(python3 -c "
          import json
          data = json.load(open('/tmp/scan_result.json'))
          lines = []
          for m in data.get('matches', []):
              lines.append(f\"- \`{m['file']}:{m['line_number']}\` (pattern {m['pattern_index']}): \`{m['line'].strip()}\`\")
          print('\n'.join(lines))
          ")
            BODY="${MARKER}
          ### Name-leak warn-gate: ${MATCH_COUNT} match(es) found

          The following added lines match the name-leak roster. These may be
          valid citations or unintended leaks — please review each one and
          decide whether to keep or scrub.

          ${MATCHES_TEXT}

          *This is an advisory comment only — it does not block merge.*"
          else
            BODY="${MARKER}
          ### Name-leak warn-gate: no matches on current tip

          No personal/agent name mentions found in the diff against \`${{ github.base_ref }}\`.

          *This is an advisory comment only — it does not block merge.*"
          fi

          if [ -n "$EXISTING_ID" ]; then
            # Update existing comment
            gh api --method PATCH \
              repos/${{ github.repository }}/issues/comments/${EXISTING_ID} \
              -f body="$BODY"
          else
            # Create new comment
            gh pr comment "$PR_NUMBER" --body "$BODY"
          fi

      # ── 5. stray-master-ref-check ───────────────────────────────────────
      # #1884 — the 2026-07-03 master->main rename (#1645) left three stray
      # `master` references undetected for five weeks in live workflow/ops
      # surfaces (one of them silent: a workflow branch filter that existed,
      # looked armed, and simply never fired). Advisory, never blocks —
      # same posture as name-leak-warn: a false positive on a legitimate
      # historical reference should cost a glance, not a red X. Scoped to
      # load-bearing surfaces only (workflows + ops shell); docs/** prose
      # (which correctly narrates `master` as history) is out of scope by
      # design — see tools/stray_master_ref_check.py's module docstring.
      - name: stray-master-ref-check — scan workflows + ops shell for stray master refs
        if: success() || failure()
        continue-on-error: true
        run: |
          python3 tools/stray_master_ref_check.py | tee -a "$GITHUB_STEP_SUMMARY"

      # ── 5b. stray-baton-path-check ───────────────────────────────────────
      # #2316 — the 2026-06-27 baton-store cutover left 13 files carrying the
      # pre-cutover path, three of them live runtime defaults rather than
      # merely documentation (one measured to miss 56% of real in-flight
      # batons as a result). The old directory was never removed, so a stale
      # reference resolves silently to a real-looking but wrong tree instead
      # of failing loudly. Advisory, never blocks — same posture as
      # stray-master-ref-check: a false positive on a legitimate historical
      # note should cost a glance, not a red X. Whole-tree by design (unlike
      # stray-master-ref-check's load-bearing-surfaces-only scope) — see
      # tools/stray_baton_path_check.py's module docstring for why.
      - name: stray-baton-path-check — scan for the stale pre-cutover baton path
        if: success() || failure()
        continue-on-error: true
        run: |
          python3 tools/stray_baton_path_check.py | tee -a "$GITHUB_STEP_SUMMARY"

      # ── 6. invariant-checks ────────────────────────────────────────────
      # (from invariant-checks.yml)
      # Always-on whole-repo invariant gates: scan-leaks + frontmatter-lint.
      #
      # These are repo-level properties — not per-changed-file — so they must run
      # on every dev PR regardless of what changed. The import-graph selection in
      # affected-tests.yml cannot reliably cover them:
      #
      #   - scan-leaks reads the whole tree; a .md or .sh change that resolves to
      #     non-scan-leaks tests silently skips the scan-leaks gate.
      #   - test_skill_frontmatter_lint.py checks every skill; the skills/claude/
      #     prefix in test-map.json is stale post-restructuring (#1421 note — the
      #     actual path is src/engram/skills/claude/; the stale prefix is a follow-up
      #     to fix in the test-map sweep, but the always-on gate here closes the gap
      #     in the meantime).
      #
      # Two concrete regressions (2026-06-24, v0.1.3 merge wave — issue #1421):
      #   #1382 (engram-dream-fairy.md): private dev-repo URL leaked into a shipped
      #     file — scan-leaks never ran on the PR, would have blocked the v0.1.3
      #     public cut (scan-leaks is the release gate).
      #   #1391 (engram-health-exam SKILL.md): YAML-breaking colon in description —
      #     frontmatter-lint wasn't selected for that PR; YAML error slipped through.
      # Both were caught only because a later PR (#1418) had an unresolvable .sh file
      # that triggered the full-suite fallback. That is luck, not a gate.
      #
      # Split rationale mirrors manifest-gate.yml: cheap stdlib+pytest gates run on
      # every dev PR independently of the selective unit-test path in affected-tests.yml.
      - name: Set up Python 3.12 (invariant-checks)
        id: setup-python-invariant
        if: success() || failure()
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: invariant-checks — install deps (pytest + pyyaml for frontmatter-lint)
        id: install-deps-invariant
        if: success() || failure()
        run: pip install pytest pyyaml

      - name: invariant-checks — scan-leaks (whole-repo structural invariant)
        if: (success() || failure()) && steps.setup-python-invariant.outcome == 'success' && steps.install-deps-invariant.outcome == 'success'
        # Runs the real-repo integration test: scans the checked-out tree for
        # structural leak patterns (private dev-repo URLs, main-repo paths) with
        # no local personal-name config (CI has none). Exit 1 = leak found.
        run: python3 -m pytest tests/test_scan_leaks.py -q

      - name: invariant-checks — frontmatter-lint (all skill SKILL.md frontmatters)
        if: (success() || failure()) && steps.setup-python-invariant.outcome == 'success' && steps.install-deps-invariant.outcome == 'success'
        # Checks every src/engram/skills/claude/*/SKILL.md: delimiters present,
        # yaml.safe_load parses, name + description fields non-empty, name
        # matches directory. Fails on the first YAML-breaking colon or malformed
        # frontmatter block.
        run: python3 -m pytest tests/test_skill_frontmatter_lint.py -q

      - name: invariant-checks — health L0 set hash (MAJOR-bump gate)
        if: (success() || failure()) && steps.setup-python-invariant.outcome == 'success' && steps.install-deps-invariant.outcome == 'success'
        # Pins a SHA over the canonical L0 measurement set — every
        # MeasurementDef's (name, population, definition_inputs). An add,
        # remove, or silent redefinition through a remote constant (e.g.
        # CLAIM_BEARING_TYPES) fails this until health.version.MAJOR is
        # bumped and the pin re-set IN THE SAME COMMIT. Pure stdlib+pytest,
        # 27 tests in well under a second — same cost class as the gates
        # above, and it is the only enforcement of the MAJOR-bump
        # convention on dev PRs.
        run: python3 -m pytest tests/test_health_measurements.py -q

      - name: invariant-checks — health version tag-diff gate (engram-alpha#2563 Gap 3)
        if: (success() || failure()) && steps.setup-python-invariant.outcome == 'success' && steps.install-deps-invariant.outcome == 'success'
        # Checks health/version.py's (MAJOR, MINOR) against how HEAD's L0
        # measurement set differs from the last deployable tag (refs/tags/v*
        # union refs/tags/deploy/*). Two independent checks: well-formedness
        # of the staged version delta (pure arithmetic, denies malformed
        # shapes without ever touching hashes), then adequacy of that delta
        # against the required severity computed from L0 hashes at HEAD vs
        # at the tag. Gap 2 (the derived-layer hash) is not built yet, so
        # the required severity can only be MAJOR or NONE in this PR — see
        # the test module's docstring. PASSES with a stated "gate inactive"
        # reason today, since no deployable tag yet carries health/version.py.
        # After the pytest line (which passes silently either way), print the
        # live gate verdict so the CI log names T — an inactive gate and an
        # active one otherwise leave the same "N passed" log (#2588 review).
        run: |
          python3 -m pytest tests/test_health_version_gate.py -q
          python3 -c "import importlib.util as u; s=u.spec_from_file_location('g','tests/test_health_version_gate.py'); g=u.module_from_spec(s); s.loader.exec_module(g); status, msg = g.run_live_gate(); print(f'health-version gate (live): {status} | {msg}')"

      - name: invariant-checks — claude-md-budget (project CLAUDE.md <= 75,000 bytes now, 40,000 is the #3322 round-2 target)
        if: success() || failure()
        # CLAUDE.md loads into every session started from this repo, and had grown
        # to ~115 KB of mostly dated measurement history. Rules stay in CLAUDE.md;
        # evidence lives in docs/. One `wc` — stdlib, well inside the under-one-
        # minute cost rule (Branching convention). The nothing-lost half of the
        # contract is tests/test_claude_md_moves.py (docs/claude-md-moves.json).
        run: |
          size="$(wc -c < CLAUDE.md)"
          if [ "$size" -gt 75000 ]; then
            echo "::error::CLAUDE.md is $size bytes; the budget is 75000 (round 1 of #3322; round 2 lowers it to 40000). Move dated measurement history to docs/ (rules stay) and list the move in docs/claude-md-moves.json."
            exit 1
          fi
          echo "CLAUDE.md is $size bytes (budget 75000)."

      # ── 7. manifest-gate ───────────────────────────────────────────────
      # (from manifest-gate.yml)
      # Cheap tag-once tiering gate — runs on EVERY dev PR (and main PRs).
      # This is the sub-second JSON+filesystem check that catches "forgot to
      # tier a new skill/hook/agent" BEFORE it merges into dev.
      #
      # Split rationale (Lei 2026-06-01 CI-economics decision, documented in
      # tests.yml header): the expensive full pytest matrix suite (~5min wall,
      # py3.12) is main-only; cheap scrub gates run on every dev PR.
      # test_tiers_manifest.py is a pure stdlib+pytest gate (0.02s); it runs
      # here.  test_tier_sizes.py imports server.py which requires fastmcp and
      # the full requirements-dev.txt stack — it stays in tests.yml (main-only
      # matrix).  See tests.yml for the full-suite rationale.
      - name: Set up Python 3.12 (manifest-gate)
        id: setup-python-manifest
        if: success() || failure()
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: manifest-gate — install pytest
        id: install-pytest-manifest
        if: success() || failure()
        run: pip install pytest

      - name: manifest-gate — run tag-once manifest gate
        if: (success() || failure()) && steps.setup-python-manifest.outcome == 'success' && steps.install-pytest-manifest.outcome == 'success'
        run: python3 -m pytest tests/test_tiers_manifest.py -q

      - name: manifest-gate — run tiers↔test-map completeness check
        if: (success() || failure()) && steps.setup-python-manifest.outcome == 'success' && steps.install-pytest-manifest.outcome == 'success'
        # Asserts every tool tagged in tiers.json has a test-map.json entry
        # (mapped or unmapped).  Pure stdlib + pytest — no heavy deps needed.
        # Moved here from the main-only full suite (tests.yml) so missing
        # entries are caught at dev-PR time rather than only at release-cut.
        # See issue #1147.
        run: python3 -m pytest tests/test_run_touched_tests.py::TestMappingCompleteness -q

      # ── 7b. artifact-drift guards ───────────────────────────────────────
      # #2340 — two checked-in generated-artifact drift guards ran in NO
      # workflow at all until now: dev PRs never exercised them, so staleness
      # was only ever caught by luck (an unrelated branch tripping the same
      # test locally) or at release-cut. Same "staleness-by-omission" class
      # test_tiers_manifest.py already guards above — an artifact that goes
      # stale by NOT being edited when its generator's inputs change, which a
      # diff-anchored review is structurally blind to (the stale file is
      # never in the diff).
      #
      # Prior art: #2371 (open, parked since 08-29 on cost). That PR
      # installs fastmcp unconditionally for both guards together; the
      # merge-seat read there was that the capability-index half's
      # `pip install fastmcp` (~7.5s on CI, #2371's own measurement) is a
      # cost-model item against the #1597 dev-PR CI budget (3000 min/month,
      # all repos), which needs the budget owner's ruling. This version
      # shrinks that ask rather than removing it: the pilots guard (below)
      # needs nothing beyond this job's existing pytest+pyyaml install (invariant-checks, step 6 above — no new
      # install), so it runs unconditionally at ~0.4s marginal cost; the
      # capability-index guard is PATH-GATED so the fastmcp install only
      # pays on PRs that could plausibly stale the index. Built on a separate branch;
      # #2371 itself is untouched.
      - name: artifact-drift guards — instruction-manifestation pilots (rendered harness contract)
        if: (success() || failure()) && steps.install-deps-invariant.outcome == 'success' && steps.setup-python-manifest.outcome == 'success'
        # tests/test_instruction_manifestation_pilots.py checks the rendered
        # harness contract (deploy/tool_policy_facts.py's output) against the
        # pilot fixtures; needs only pytest+pyyaml, already installed at
        # invariant-checks above (step 6) — no new install step. Unconditional
        # (not path-gated): the cost is low enough (6 passed, 0.40s measured
        # in a pytest+pyyaml venv) that gating it would add gate-complexity
        # without a corresponding saving, unlike the capability-index guard
        # below.
        run: python3 -m pytest tests/test_instruction_manifestation_pilots.py -q

      # tool_capability_index.txt (checked in, generated by
      # tools/engram-generate-tool-capability-index.py from the `capability=`
      # text declared in src/engram/server.py — confirmed the only file
      # declaring it: `grep -rln --include='*.py' 'capability=' src` returns
      # only src/engram/server.py) can go stale the same way: a `capability=`
      # string edited in server.py with no matching regen of the .txt file is
      # invisible to a diff-anchored review, same staleness-by-omission shape
      # as tiers.json above.
      #
      # Path-gated (not unconditional), unlike the pilots guard above: this
      # one is a real cost-model item. tests/test_tool_capability_index.py
      # imports src/engram/server.py, which imports `fastmcp` at module scope
      # — a real ModuleNotFoundError on a bare runner (measured: cold `pip
      # install fastmcp` 16.4s locally; #2371 measured ~7.5s on CI). The path
      # list below is complete, not just the two files normally in play: the
      # generated index itself, its generator, its own test, and this
      # workflow file (a change to the gate's own logic should re-run what it
      # gates). No `paths:`-filter idiom exists in this repo's workflows (see
      # hooks-stdout-audit's note above, which this step's git-diff shape
      # borrows) — follows the same roster-check / scan pair idiom instead:
      # an id: + $GITHUB_OUTPUT flag gates the heavier steps that follow,
      # same as check-stubbed-signatures / hooks-stdout-audit above. Means
      # ~0s added for PRs that don't touch those paths.
      #
      # Fails CLOSED on a git-diff failure (e.g. a mis-resolved base ref):
      # explicitly captures git diff's own exit status and exits non-zero
      # rather than letting an empty $CHANGED read as "not touched" — the
      # same explicit-STATUS-check shape check-stubbed-signatures uses above.
      # (hooks-stdout-audit's variant also stops on a git-diff failure, via
      # the runner's default `bash -e`, but with no message; the explicit
      # check here names the cause in the log.) Relies on
      # this job's shared `actions/checkout@v4` step having `fetch-depth: 0`
      # (set at the top of this file) so the three-dot diff against
      # origin/${{ github.base_ref }} has the base history to diff against.
      - name: capidx-gate — check whether the diff touches capability-index-affected paths
        id: capidx-gate
        if: success() || failure()
        run: |
          set +e
          CHANGED=$(git diff --no-renames --name-only "origin/${{ github.base_ref }}...HEAD")
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::git diff failed (exit $STATUS) — cannot determine whether capability-index-affected paths changed; failing closed rather than defaulting to skip."
            exit "$STATUS"
          fi
          MATCHED=$(echo "$CHANGED" | grep -E '^(src/engram/server\.py|src/engram/tool_capability_index\.txt|tools/engram-generate-tool-capability-index\.py|tests/test_tool_capability_index\.py|\.github/workflows/pr-checks\.yml)$' || true)
          if [ -n "$MATCHED" ]; then
            echo "capidx-gate: diff touches $(echo "$MATCHED" | tr '\n' ' ') — guard will run."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "capidx-gate: diff does not touch capability-index-affected paths — guard self-skips."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: artifact-drift guards — install fastmcp (tool-capability-index guard's server.py import dependency)
        id: install-fastmcp
        if: (success() || failure()) && steps.capidx-gate.outcome == 'success' && steps.capidx-gate.outputs.run == 'true'
        # Pinned to match requirements/requirements-lock.txt's fastmcp==3.3.0
        # (not the unpinned `pip install fastmcp` #2371 used) — only the
        # import surface this test needs, not the full requirements.txt
        # stack (sentence-transformers/huggingface_hub/sqlite-vec are not
        # required; server.py degrades gracefully to its documented O(N)
        # fallback when sqlite-vec is absent — see #728).
        run: pip install "fastmcp==3.3.0"

      - name: artifact-drift guards — tool-capability-index (generated artifact vs. live capability= text)
        if: (success() || failure()) && steps.capidx-gate.outputs.run == 'true' && steps.install-fastmcp.outcome == 'success' && steps.install-deps-invariant.outcome == 'success'
        run: python3 -m pytest tests/test_tool_capability_index.py -q

      # ── 7c. stdlib-only guards ────────────────────────────────────────────
      # #2376 — five more SSoT/sync/drift guards that ran in no CI workflow at
      # all, reachable only at release-cut, same staleness-by-omission class
      # as manifest-gate's own tiers.json check above. Measured (not assumed)
      # to need nothing beyond this same Python 3.12 + pytest setup: a fresh
      # venv with ONLY `pip install pytest` (no requirements.txt) runs all
      # five clean, ~1s combined. They sit inside the "pure stdlib + pytest"
      # carve-out this file already documents at manifest-gate above, so —
      # unlike #2371's tool_capability_index guard, which needs fastmcp and
      # is therefore a real cost-model question — these need no ruling.
      #
      # test_skill_server_sync.py deliberately NOT wired here even though it
      # was measured alongside these five: it is a documented #1149 tombstone
      # (SKILL.md retired, all 4 tests unconditionally skipped) — wiring a
      # step that runs, does nothing, and can never fail would read as
      # coverage that isn't there.
      - name: stdlib-only guards — claude-md-drift, plugin-manifest-import-sync, tool-policy-sync, upgrade-drift-sources, build-plugin-hooks-consistency, claude-md-moves
        if: (success() || failure()) && steps.setup-python-manifest.outcome == 'success' && steps.install-pytest-manifest.outcome == 'success'
        run: |
          python3 -m pytest \
            tests/test_check_claude_md_drift.py \
            tests/test_plugin_manifest_import_sync.py \
            tests/test_tool_policy_sync.py \
            tests/test_upgrade_drift_sources.py \
            tests/test_build_plugin_hooks_consistency.py \
            tests/test_claude_md_moves.py \
            -q

      # ── 7d. cascade behaviour acceptance (playbox) ──────────────────────
      # The #2013 cascade machine is accepted by BEHAVIOUR: tests/cascade_
      # scenarios/ drives supersede / retract / frontier / resolve through the
      # real engram_revision.py on named topologies (tests/cascade_playbox.py)
      # and asserts the ruled guarantees at each stage — CD-01..09 on Lei's
      # converging diamonds, incl. the #2343 refusal. Lei, 2026-08-29: these
      # belong in the automated gate, not only the release-cut suite.
      #
      # Measured (not assumed) to fit the stdlib carve-out above: a fresh venv
      # with ONLY `pip install pytest` runs cascade_scenarios + the playbox
      # harness clean — 26 passed in 1.6s on 6f7addbf. engram_core imports
      # `server` lazily inside a function, never at module scope, so no
      # fastmcp is pulled in; nothing here needs a cost-model ruling.
      - name: cascade behaviour acceptance — playbox scenarios CD-01..09 + harness
        if: (success() || failure()) && steps.setup-python-manifest.outcome == 'success' && steps.install-pytest-manifest.outcome == 'success'
        run: |
          python3 -m pytest \
            tests/cascade_scenarios \
            tests/test_cascade_playbox.py \
            -q

      # ── 8. test-id-set-check ────────────────────────────────────────────
      # #2350 — a deleted test cannot fail, so a PR that removes coverage is
      # exactly as green as a PR that adds it: no existing gate here reads
      # which tests *stopped existing*. A count is NOT enough — measured on
      # the motivating commit (2ecf88c, tests/test_cascade_resolve.py +
      # tests/test_supported_by.py): whole-tree count delta -7 vs the real
      # set diff of 11 disappeared / 4 appeared; one of those disappearances
      # (test_supported_by.py) is a perfect 1:1 rename with a COUNT DELTA OF
      # ZERO, invisible to any count-based check in a file a count-based
      # sweep would certify as clean.
      #
      # BLOCKING, unlike the advisory name-leak-warn / stray-master-ref-check
      # steps above: the whole point of this gate is that a silent test
      # deletion is currently free — an advisory posture would leave it free.
      #
      # Compares base (the merge-base of the PR's target branch, NOT the
      # target branch's current tip — so tests deleted on dev since the
      # branch point are never attributed to this PR) against HEAD. This
      # matters even though actions/checkout does default to the PR merge
      # ref: that merge commit's base-parent is a SNAPSHOT of the target
      # branch as of this PR's last sync event, not a live pointer at the
      # target's current tip — so the merge-base and the branch's current
      # tip genuinely differ whenever anything has landed on the target
      # branch since that sync. A PR body line `Removed-test: <id> —
      # <reason>` accounts for a legitimate deletion; see
      # tools/test_id_set_check.py's module docstring for the full marker
      # syntax and the accounting rules.
      - name: test-id-set-check — fail on a shrinking test-id set without a Removed-test marker
        if: success() || failure()
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          printf '%s' "$PR_BODY" > /tmp/pr_body.txt
          python3 tools/test_id_set_check.py \
            --base "$BASE_SHA" --head HEAD \
            --pr-body-file /tmp/pr_body.txt \
            --gh-repo ${{ github.repository }}

      # ── 8b. test-id-set-check-unit-tests ────────────────────────────────
      # #2950/#2959 — reviewer-fairy round 2: step 8 above runs the TOOL
      # against this PR's own diff, but the tool's own test suite
      # (tests/test_test_id_set_check.py) was not wired into any dev-PR
      # gate — including test_2950_real_workflow_scan_roots_match_test_
      # scan_roots_constant, the CI-enforced comparison that catches
      # TEST_SCAN_ROOTS (this file's constant) drifting from
      # .github/workflows/tests.yml's actual full-suite pytest invocation.
      # A drift PR — or a regression to the workflow-line parser itself —
      # was therefore green through pr-checks and would only fail on the
      # dev->main release cut, the same "gate positioned outside the path
      # where the decision is made cannot protect the thing it audits"
      # shape as hooks-stdout-audit below (#2718/#2717).
      #
      # BLOCKING, same posture as step 8 (its own tool-invocation test):
      # a silent regression to the sync gate is currently free at PR time;
      # an advisory posture would leave it free.
      #
      # Whole file, not `-k`-filtered to the #2950 tests alone — same
      # precedent as manifest-gate's `pytest tests/test_tiers_manifest.py
      # -q` above: run the file that owns the gate. Fits the same "pure
      # stdlib + pytest" carve-out already used by manifest-gate /
      # stdlib-only guards / cascade-behaviour-acceptance above (no
      # requirements-dev.txt install) — the tool module under test imports
      # only argparse/ast/json/re/subprocess/sys/dataclasses/pathlib
      # (confirmed via its own imports), and the suite's git-backed tests
      # (#2381) run real `git` subprocess calls against THIS checkout,
      # which the job's `actions/checkout@v4` step already provides with
      # `fetch-depth: 0` / `fetch-tags: true`. Measured locally: 83 passed
      # in ~6s.
      - name: test-id-set-check-unit-tests — run tests/test_test_id_set_check.py (includes the #2950 TEST_SCAN_ROOTS <-> tests.yml sync gate)
        if: (success() || failure()) && steps.setup-python-manifest.outcome == 'success' && steps.install-pytest-manifest.outcome == 'success'
        run: python3 -m pytest tests/test_test_id_set_check.py -q

      # ── 9. hooks-stdout-audit ───────────────────────────────────────────
      # #2718 — tests/test_hooks_json_stdout_audit.py previously ran ONLY in
      # the nightly full suite (tests.yml). Per this repo's CI cost model, dev
      # PRs run only pr-checks — so a PR adding a plaintext-stdout `echo` to a
      # referenced shell hook was green on every gate that ran at PR time and
      # failed hours later in a nightly nobody watches live. Measured: #2700
      # (d266825b) passed fairy, colleague, and pr-checks, then broke the
      # audit in the 13:38Z nightly (#2717). "A gate positioned outside the
      # path where the decision is made cannot protect the thing it audits."
      #
      # Path-scoped (not unconditional) to avoid reintroducing full-suite-class
      # cost on every PR: the audit itself is fast (<1s, pure stdlib+pytest —
      # same carve-out as manifest-gate / stdlib-only guards above), but the
      # PRINCIPLE from #1597 is per-check cost discipline, not just wall-clock
      # — so it only runs when the diff could plausibly regress it.
      #
      # No existing paths:-filter idiom exists in this repo's workflows (the
      # `on: pull_request` trigger above deliberately carries no `paths:`, and
      # no workflow here uses dorny/paths-filter or an equivalent action) — so
      # this follows the closest in-file idiom instead: the roster-check /
      # scan pair in the name-leak-warn step above (id: + $GITHUB_OUTPUT +
      # `if: steps.<id>.outputs.<flag>` on the next step), rather than
      # inventing a new mechanism or adding a new action dependency.
      #
      # BLOCKING (unlike name-leak-warn's advisory pattern it borrows the
      # shape from) — the whole point of this gate is that a real regression
      # here is currently free at PR time; an advisory posture would leave it
      # free, same reasoning as test-id-set-check above.
      - name: hooks-stdout-audit — check whether the diff touches src/engram/hooks/ or hooks.json
        id: hooks-diff-check
        if: success() || failure()
        run: |
          BASE_REF="origin/${{ github.base_ref }}"
          # --no-renames: --name-only collapses a detected rename to the
          # destination path alone. A hook file moved OUT of
          # src/engram/hooks/ while being modified (hooks.json untouched)
          # would then show only the new path and the predicate below would
          # miss it — a false SKIP on exactly the change most likely to
          # break the audit. --no-renames forces both the old and new path
          # to appear as separate entries so the predicate still matches.
          CHANGED=$(git diff --no-renames --name-only "$BASE_REF...HEAD")
          if echo "$CHANGED" | grep -qE '^src/engram/hooks/|(^|/)hooks\.json$'; then
            echo "Diff touches src/engram/hooks/ or hooks.json — audit will run."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Diff does not touch src/engram/hooks/ or hooks.json — audit self-skips."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: hooks-stdout-audit — run test_hooks_json_stdout_audit.py
        if: (success() || failure()) && steps.hooks-diff-check.outputs.run == 'true' && steps.setup-python-manifest.outcome == 'success' && steps.install-pytest-manifest.outcome == 'success'
        run: python3 -m pytest tests/test_hooks_json_stdout_audit.py -q

      # ── 10. team-practice-drift-gate (umwelt#811) ───────────────────────
      # A generated `<!-- BEGIN team-practice: <key> ... -->` region in this
      # file's CLAUDE.md must match what team-practice's TEAM-PRACTICE.md
      # would currently render — a hand-edit inside one is exactly the
      # silent-drift shape the generated-region mechanism (chosen over a
      # CLAUDE.md `@import`, which was shown to silently fail in unattended
      # sessions — umwelt#811) exists to make loud instead.
      #
      # ADVISORY, NOT BLOCKING, until a cross-repo read credential exists —
      # this is not a fresh design choice, it mirrors an already-established
      # remedy for the identical defect class: exam-room#23 hit this exact
      # failure (default GITHUB_TOKEN cannot read a private sibling repo in
      # this org — a GitHub platform limit, not an org-config toggle) and
      # reverted to a loud non-blocking warning; exam-room#24 (still open)
      # carries mira-verala's security-seat recommendation — a dedicated
      # org-owned GitHub App installed on team-practice only, Contents:
      # Read-only, installation token minted per job, NOT a classic PAT —
      # exam-room#24's own recommended shape. Lei's actual provisioned
      # credential (2026-09-16) is a fine-grained PAT, `TEAM_PRACTICE_TOKEN`
      # (contents:read on team-practice, scoped to alpha/umwelt/soma) —
      # simpler than the App for this narrower, lower-stakes case; his call,
      # not re-litigated here. Making this step unconditionally BLOCKING (as
      # an earlier revision of this PR did) would have held every future PR
      # to this repo hostage to the org-admin item landing, which is a
      # materially worse failure than "the drift check doesn't run yet" —
      # `continue-on-error` stays on the checkout as a safety margin (a
      # misconfigured/expired secret degrades to advisory, never blocks
      # every PR again) even now that the token exists.
      #
      # KEPLER'S CORRECTION (2026-09-16, forum #414) — advisory-for-everyone
      # was itself a silent-pass hazard, caught reading this exact PR's own
      # CI log at the per-step level: the checkout's `conclusion` reads
      # `success` even when it FAILED, because `continue-on-error` masks
      # that at the job/API level by design — a `gh pr checks`/`gh api
      # jobs` read (conclusion-level) cannot tell "the real check ran and
      # passed" from "the real check was skipped because checkout failed,
      # but that failure was masked." Fork PRs structurally cannot carry
      # this repo's secrets, so advisory is correct for them — but a PR
      # from a branch of THIS repo failing the checkout means the secret
      # was deleted, renamed, or mis-scoped, and that must be a loud
      # failure, not a silent skip. `continue-on-error` is now an
      # expression: true (advisory) only when the PR head is a fork.
      # persist-credentials: false — TEAM_PRACTICE_TOKEN is a longer-lived
      # fine-grained PAT (not a per-job-expiring App installation token),
      # and nothing downstream needs git credentials persisted in this
      # clone — the next step only reads one file with python3. Same
      # posture the security-seat guidance on exam-room#24 names for the
      # analogous App-token case.
      - name: team-practice-drift-gate — checkout team-practice
        id: team-practice-checkout
        if: success() || failure()
        continue-on-error: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        uses: actions/checkout@v4
        with:
          repository: engram-agents/team-practice
          path: team-practice
          token: ${{ secrets.TEAM_PRACTICE_TOKEN }}
          persist-credentials: false

      - name: team-practice-drift-gate — run sync_team_practice.py --check
        if: (success() || failure()) && steps.team-practice-checkout.outcome == 'success'
        run: |
          python3 team-practice/tools/sync_team_practice.py --check CLAUDE.md \
            --team-practice team-practice/TEAM-PRACTICE.md

      # This step's own `if:` cannot currently fire on a same-repo checkout
      # failure — GitHub implicitly prepends success() to any custom `if:`
      # that doesn't itself reference success()/failure()/always()/
      # cancelled(), so once the checkout step fails WITHOUT continue-on-
      # error (the same-repo case), the job's success() goes false and this
      # step is skipped right along with the check step above — empirically
      # confirmed on run 35107780940 (2026-09-16 14:20Z): checkout=failure,
      # check=skipped, advisory=skipped, not fired. So the message below is
      # NOT currently reachable in the same-repo-failure case despite its
      # own `!= 'success'` condition looking unconditional on paper.
      #
      # Kept fork-agnostic anyway, defense-in-depth: if this step's `if:`
      # is ever changed to explicitly include always()/failure() (a change
      # that would legitimately make it reachable on a same-repo failure),
      # a message that unconditionally blames "this fork PR" would become
      # actively misleading exactly when a real secret problem needs a
      # clear diagnosis. Cheap to get right now rather than rediscover
      # later.
      - name: team-practice-drift-gate — advisory notice (checkout unavailable)
        if: (success() || failure()) && steps.team-practice-checkout.outcome != 'success'
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name != github.repository }}" = "true" ]; then
            echo "::warning::team-practice-drift-gate could not check out engram-agents/team-practice from this fork PR (fork PRs cannot carry this repo's secrets by design). CLAUDE.md's generated-region drift is NOT being checked on this run — see umwelt#811."
          else
            echo "::warning::team-practice-drift-gate could not check out engram-agents/team-practice, and this is NOT a fork PR — that means the secret was deleted, renamed, or mis-scoped. CLAUDE.md's generated-region drift is NOT being checked on this run — see umwelt#811."
          fi

      # ── 11. check-stubbed-signatures ────────────────────────────────────
      # #3118 — see this file's header comment (step 11) and
      # tools/check_stubbed_signatures.py's own module docstring for the
      # full rationale. BLOCKING: a stub-shadowed signature regression is
      # currently free at PR time (only caught hours later on the
      # dev->main release cut); an advisory posture would leave it free,
      # same reasoning as test-id-set-check / hooks-stdout-audit above.
      #
      # The tool itself needs nothing beyond stdlib (argparse/re/subprocess/
      # sys/pathlib — confirmed via its own imports) and runs real `git`
      # subprocess calls against THIS checkout, which the job's
      # actions/checkout@v4 step already provides with fetch-depth: 0. No
      # extra install step for the tool's own run. Dependencies for the
      # AFFECTED TESTS it selects (if any) are installed separately below,
      # conditionally — most PRs touch nothing this gate flags, and paying
      # requirements-dev.txt's install cost on every PR regardless would be
      # the wrong trade (mirrors the roster-check / scan pair idiom used by
      # name-leak-warn / hooks-stdout-audit above: an id: + $GITHUB_OUTPUT
      # flag gates the heavier steps that follow).
      - name: check-stubbed-signatures — compute stub-affected test files
        id: stub-check
        if: success() || failure()
        run: |
          set +e
          python3 tools/check_stubbed_signatures.py --base "origin/${{ github.base_ref }}" > /tmp/stub_affected_tests.txt
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::check_stubbed_signatures.py failed (exit $STATUS) — see the log above for the stderr message."
            exit "$STATUS"
          fi
          if [ -s /tmp/stub_affected_tests.txt ]; then
            echo "has_hits=true" >> "$GITHUB_OUTPUT"
            echo "Stub-affected test files for this diff:"
            cat /tmp/stub_affected_tests.txt
          else
            echo "has_hits=false" >> "$GITHUB_OUTPUT"
            echo "No stub-affected test files for this diff. ✓"
          fi

      - name: Set up Python 3.12 (check-stubbed-signatures)
        id: setup-python-stub
        if: (success() || failure()) && steps.stub-check.outputs.has_hits == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/requirements-dev.txt

      - name: check-stubbed-signatures — install dependencies for affected tests
        id: install-deps-stub
        if: (success() || failure()) && steps.stub-check.outputs.has_hits == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements-dev.txt
          # src/forum/tests/ imports forum.server (Flask + bleach +
          # markdown-it-py + beautifulsoup4 + html5lib); those deps live in
          # src/forum/requirements.txt — same rationale as affected-tests.yml's
          # identical install step. Installed unconditionally here (rather
          # than a second path-scoped conditional) since it's cheap relative
          # to requirements-dev.txt and this step already only runs when
          # there are hits to test.
          if grep -q '^src/forum/tests/' /tmp/stub_affected_tests.txt; then
            pip install -r src/forum/requirements.txt
          fi

      - name: check-stubbed-signatures — run stub-affected tests
        if: (success() || failure()) && steps.stub-check.outputs.has_hits == 'true' && steps.setup-python-stub.outcome == 'success' && steps.install-deps-stub.outcome == 'success'
        run: python3 -m pytest $(cat /tmp/stub_affected_tests.txt) -v --tb=short

