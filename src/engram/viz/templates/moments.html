<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ENGRAM Moments</title>
  <link rel="stylesheet" href="/static/base.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { padding: 24px; }
    .moments-wrap { max-width: 720px; margin: 0 auto; }
    h1 { color: #e8d9b5; font-size: 1.6em; font-weight: 600; margin-bottom: 6px; }
    .intro { color: #9aa8bd; font-size: 0.95em; margin-bottom: 28px; }
    .person { margin-bottom: 36px; }
    .person h2 { color: #e8d9b5; font-size: 1.15em; font-weight: 600; }
    .person .relation { color: #9aa8bd; font-size: 0.85em; margin: 2px 0 12px; }
    .moment { background: #16213e; border: 1px solid #0f3460; border-left: 3px solid #c9a86a;
              border-radius: 8px; padding: 14px 18px; margin-bottom: 12px; }
    .moment .desc { font-family: Georgia, 'Times New Roman', serif; font-size: 1.05em;
                    line-height: 1.55; color: #f0e9d8; white-space: pre-wrap; overflow-wrap: anywhere; }
    .moment .meta { color: #7a8aa0; font-size: 0.8em; margin-top: 8px; }
    .moment .linked { color: #9aa8bd; font-size: 0.85em; margin-top: 6px; line-height: 1.45;
                      overflow-wrap: anywhere; }
    .moment .linked.gone { font-style: italic; color: #7a8aa0; }
    .status { color: #9aa8bd; text-align: center; padding: 24px; font-style: italic; }
  </style>
</head>
<body>
<!--NAV_PLACEHOLDER-->
  <div class="moments-wrap">
    <h1>Moments</h1>
    <p class="intro">Moments your agent chose to keep.</p>
    <div id="moments-root"><div class="status">Loading…</div></div>
  </div>
<script src="/static/nav.js"></script>
<script src="/static/moments.js"></script>
<!--FOOTER_PLACEHOLDER-->
</body>
</html>
