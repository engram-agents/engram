<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ENGRAM Health Dashboard</title>
  <link rel="stylesheet" href="/static/base.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* font-family/background/color moved to static/base.css's shared body{}
       rule (engram-alpha#2555 PR C, forum #389) -- only this page's own
       padding remains local, since base.css's copy is linked BEFORE this
       <style> block and a page-local body{} declared here still wins the
       cascade on any property it sets. */
    body { padding: 24px; }
    h1 { color: #00d4ff; font-size: 1.5em; margin-bottom: 16px; }
    h2 { color: #7ecfff; font-size: 1.1em; margin: 16px 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .card { background: #16213e; border-radius: 8px; padding: 16px; border: 1px solid #0f3460; }
    .card h3 { color: #00d4ff; font-size: 0.95em; margin-bottom: 10px; }
    .metric { display: flex; justify-content: space-between; padding: 4px 0;
              border-bottom: 1px solid #0f3460; font-size: 0.85em; }
    .metric:last-child { border-bottom: none; }
    .metric .label { color: #aaa; }
    .metric .value { color: #fff; font-weight: 600; }
    .metric .value.warn { color: #ff9800; }
    .metric .value.danger { color: #f44336; }
    .metric .value.good { color: #4caf50; }
    .gauge { width: 120px; height: 120px; margin: 0 auto 12px; position: relative; }
    .gauge canvas { width: 120px; height: 120px; }
    .gauge .score { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                    font-size: 1.8em; font-weight: 700; }
    .bar-chart { display: flex; align-items: flex-end; gap: 4px; height: 80px; margin-top: 8px; }
    .bar-chart .bar { flex: 1; background: #00d4ff; border-radius: 3px 3px 0 0;
                      min-width: 20px; position: relative; transition: height 0.3s; }
    .bar-chart .bar .bar-label { position: absolute; bottom: -18px; left: 50%;
                                  transform: translateX(-50%); font-size: 0.65em; color: #888; white-space: nowrap; }
    .bar-chart .bar .bar-value { position: absolute; top: -16px; left: 50%;
                                  transform: translateX(-50%); font-size: 0.7em; color: #ccc; }
    .trend { margin-top: 8px; }
    .trend svg { width: 100%; height: 60px; }
    .trend path { fill: none; stroke: #00d4ff; stroke-width: 2; }
    .trend circle { fill: #00d4ff; }
    .timeline { margin-top: 8px; }
    .timeline .day { display: flex; align-items: center; gap: 8px; padding: 3px 0;
                     font-size: 0.8em; border-bottom: 1px solid #0f3460; }
    .timeline .day .date { color: #888; min-width: 80px; }
    .timeline .day .counts { display: flex; gap: 6px; flex-wrap: wrap; }
    .timeline .day .counts span { padding: 1px 6px; border-radius: 3px; font-size: 0.75em; }
    .tag-created { background: #1b5e20; color: #a5d6a7; }
    .tag-superseded { background: #4a148c; color: #ce93d8; }
    .tag-retracted { background: #b71c1c; color: #ef9a9a; }
    .tag-resolved { background: #0d47a1; color: #90caf9; }
    .tag-other { background: #37474f; color: #b0bec5; }
    #loading { text-align: center; padding: 40px; color: #888; }
    /* Calibration card — namespaced to avoid collision with existing .bar-chart */
    .calibration-bar-chart { display: flex; align-items: flex-end; gap: 3px; height: 60px; margin: 6px 0 20px; }
    .calibration-bar-chart .cal-bar { flex: 1; border-radius: 3px 3px 0 0; min-width: 16px;
                                      position: relative; transition: height 0.3s; }
    .calibration-bar-chart .cal-bar .cal-bar-label { position: absolute; bottom: -18px; left: 50%;
                                                      transform: translateX(-50%); font-size: 0.6em;
                                                      color: #888; white-space: nowrap; }
    .calibration-bar-chart .cal-bar .cal-bar-value { position: absolute; top: -14px; left: 50%;
                                                      transform: translateX(-50%); font-size: 0.65em; color: #ccc; }
    .cal-type-label { color: #7ecfff; font-size: 0.8em; margin: 10px 0 2px; font-weight: 600; }
    .cal-caption { font-size: 0.72em; color: #888; font-style: italic; margin: 8px 0 4px; }
    .cal-col-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .cal-col-header { color: #7ecfff; font-size: 0.78em; font-weight: 600; text-align: center;
                      border-bottom: 1px solid #0f3460; padding-bottom: 4px; margin-bottom: 4px; }
    .cal-col-row { font-size: 0.75em; text-align: center; padding: 2px 0; color: #d0d0d0; }
    .cal-col-type { font-size: 0.72em; color: #aaa; text-align: left; padding: 2px 0; }
    /* .nav-agent-label/.nav-agent-select/#nav-agent-wrapper consolidated
       into static/base.css's sole copy (engram-alpha#2555 PR C sweep --
       this page's copy was byte-identical dead weight left behind by PR
       B's nav-CSS consolidation, which covered .nav/.nav a/.nav a:hover
       but missed this trio). */
    /* View toggle (Normal/Detail) + Snapshot-now button shell -- #2518 slice 1.
       Page-scoped (not base.css): this control only exists on health.html. */
    .health-header { display: flex; align-items: center; justify-content: space-between;
                      flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
    .health-header h1 { margin-bottom: 0; }
    .health-header-controls { display: flex; align-items: center; gap: 12px; }
    .view-toggle { display: inline-flex; border: 1px solid #1a4a8a; border-radius: 4px;
                   overflow: hidden; }
    .view-toggle-btn { background: #0d1b36; color: #888; border: none; padding: 6px 14px;
                        font-size: 0.85em; font-family: inherit; cursor: pointer; }
    .view-toggle-btn:hover { background: #16213e; color: #ccc; }
    .view-toggle-btn.active { background: #00d4ff; color: #0d1b36; font-weight: 600; }
    .view-toggle-btn + .view-toggle-btn { border-left: 1px solid #1a4a8a; }
    .snapshot-now-btn { background: #0d1b36; color: #888; border: 1px solid #1a4a8a;
                         border-radius: 4px; padding: 6px 12px; font-size: 0.85em;
                         font-family: inherit; cursor: not-allowed; opacity: 0.6; }
    /* Detail-view empty state -- matches #loading's visual treatment
       (text-align/padding/color), per the existing dark theme. */
    .detail-empty-state { text-align: center; padding: 40px; color: #888; }
    /* Detail-view real content -- history strip + distribution (#2518,
       history-strip/distribution slice). "detail-" prefix per the existing
       .detail-empty-state convention; kept specific to #detail-view's own
       elements so nothing here can leak into #normal-view's cards. */
    .detail-scores-note { background: #2a1f00; color: #ffb74d; border: 1px solid #5c4500;
                           border-radius: 4px; padding: 8px 12px; margin-bottom: 12px;
                           font-size: 0.85em; }
    .detail-composed-value { font-size: 2em; font-weight: 700; color: #00d4ff;
                              text-align: center; margin: 4px 0; }
    .detail-provenance { text-align: center; color: #888; font-size: 0.8em; margin-bottom: 8px; }
    .detail-status-badge { display: inline-block; padding: 1px 8px; border-radius: 10px;
                            font-size: 0.7em; font-weight: 600; margin-left: 6px; vertical-align: middle; }
    .detail-status-badge.good { background: #1b5e20; color: #a5d6a7; }
    .detail-status-badge.warn { background: #4a3200; color: #ffcc80; }
    .detail-status-badge.danger { background: #b71c1c; color: #ef9a9a; }
    .detail-signal-row { margin-bottom: 12px; }
    .detail-strip-dist-container { margin-top: 8px; }
    /* Scaled-down modifier on the existing .view-toggle/.view-toggle-btn
       pattern (never a copy-paste) -- one Series/Histogram toggle per
       strip+distribution block. */
    .detail-mini-toggle { margin: 6px 0; }
    .detail-mini-toggle-btn { padding: 3px 8px; font-size: 0.72em; }
    /* Adapts the existing .trend/SVG pattern; a bare "unreplayable" tick
       mark needs its own stroke since .trend only styles path/circle. */
    .detail-unreplayable-tick { stroke: #ff9800; stroke-width: 2; stroke-dasharray: 3,3; }
    /* #2625: when the chronologically-latest point is itself unreplayable,
       the "today" marker becomes a hollow circle (not a solid/plotted
       circle, since there's no value) at that point's x -- stroked in the
       same orange as .detail-unreplayable-tick so it reads as part of the
       same "unreplayable" visual family, distinguished from an ordinary
       tick only by shape + its "(today — unreplayable: ...)" tooltip. */
    .detail-unreplayable-today-marker { fill: none; stroke: #ff9800; stroke-width: 2; }
    .detail-strip-empty, .detail-dist-empty, .detail-series-note {
      color: #888; font-size: 0.78em; font-style: italic; padding: 6px 0; }
    .detail-histogram { margin-top: 4px; }
  </style>
</head>
<body>
<!--NAV_PLACEHOLDER-->
  <div class="health-header">
    <h1>ENGRAM Health Dashboard</h1>
    <div class="health-header-controls">
      <div class="view-toggle" id="view-toggle" role="group" aria-label="View mode">
        <button type="button" class="view-toggle-btn" id="view-toggle-normal" data-view="normal">Normal</button>
        <button type="button" class="view-toggle-btn" id="view-toggle-detail" data-view="detail">Detail</button>
      </div>
      <button type="button" class="snapshot-now-btn" id="snapshot-now-btn" disabled
              title="Recompute endpoint not yet available">Snapshot now</button>
      <!--WORKBENCH_LINK_PLACEHOLDER-->
    </div>
  </div>
  <div id="normal-view">
    <div id="loading">Loading health data...</div>
    <div id="dashboard" style="display:none;">
      <div class="grid" id="cards"></div>
    </div>
  </div>
  <div id="detail-view" style="display:none;">
    <div class="detail-empty-state" id="detail-empty-state">No detail-view snapshot data yet — this view is under construction.</div>
    <div id="detail-content" style="display:none;">
      <div class="detail-scores-note" id="detail-scores-note" style="display:none;"></div>
      <div id="detail-composed-block"></div>
      <div id="detail-signal-rows"></div>
      <div id="detail-aspect-tiles"></div>
    </div>
  </div>

  <script src="/static/health-detail-math.js"></script>
  <script>
  function _currentAgent() {
    return new URL(window.location.href).searchParams.get('agent');
  }
  function _withAgent(path) {
    const a = _currentAgent();
    if (!a) return path;
    return path + (path.includes('?') ? '&' : '?') + 'agent=' + encodeURIComponent(a);
  }

  function loadHealth() {
    document.getElementById('loading').style.display = '';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('cards').innerHTML = '';
    Promise.all([
      fetch(_withAgent('/api/health')).then(r => r.json()),
      fetch(_withAgent('/api/calibration')).then(r => r.json()).catch(() => null),
    ]).then(([data, calData]) => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        if (data.error) {
          document.getElementById('cards').innerHTML = '<div class="card"><p>' + data.error + '</p></div>';
          return;
        }
        render(data);
        if (calData && !calData.error) {
          renderCalibration(calData);
        }
      })
      .catch(e => {
        document.getElementById('loading').textContent = 'Error: ' + e.message;
      });
  }

  // ── View toggle (Normal/Detail) -- #2518 slice 1 ─────────────────────────
  // State-resolution order: URL ?view= param wins if present, else the
  // localStorage preference, else "normal". Detail view has no real data
  // source yet (see #detail-view's empty-state placeholder above) -- this
  // is shell-only, no fetch, no new endpoint.
  var VIEW_STORAGE_KEY = 'healthViewPreference';

  function getInitialView() {
    var urlView = new URL(window.location.href).searchParams.get('view');
    if (urlView === 'detail' || urlView === 'normal') return urlView;
    // localStorage access throws SecurityError in a browser that denies
    // site data (e.g. Chrome "Block all cookies", Firefox
    // dom.storage.enabled=false) -- guarded so that throw can never abort
    // this top-level inline script before loadHealth() below runs.
    // Ariadne's colleague-review finding on #2579: unguarded, this took
    // down the whole dashboard, not just the toggle's persistence.
    try {
      var stored = localStorage.getItem(VIEW_STORAGE_KEY);
      if (stored === 'detail' || stored === 'normal') return stored;
    } catch (e) { /* storage blocked -- fall through to the default */ }
    return 'normal';
  }

  function applyView(view, persist) {
    var isDetail = view === 'detail';
    // Lazy-load the detail-view data, once, the first time Detail activates
    // -- on the initial applyView(getInitialView(), false) call below (when
    // ?view=detail or the stored preference already resolves to 'detail' at
    // page load) AND on a later Normal->Detail toggle click. loadDetailView()
    // itself is the single-fetch guard (a `_detailLoaded` flag), so this one
    // call site covers both triggers without fetching on every toggle click.
    if (isDetail) { loadDetailView(); }
    document.getElementById('normal-view').style.display = isDetail ? 'none' : '';
    document.getElementById('detail-view').style.display = isDetail ? '' : 'none';
    document.getElementById('view-toggle-normal').classList.toggle('active', !isDetail);
    document.getElementById('view-toggle-detail').classList.toggle('active', isDetail);
    document.getElementById('view-toggle-normal').setAttribute('aria-pressed', String(!isDetail));
    document.getElementById('view-toggle-detail').setAttribute('aria-pressed', String(isDetail));
    if (persist) {
      // See getInitialView()'s comment -- same guard, same reason.
      try {
        localStorage.setItem(VIEW_STORAGE_KEY, view);
      } catch (e) { /* storage blocked -- persistence is lost, not fatal */ }
      var url = new URL(window.location.href);
      if (isDetail) {
        url.searchParams.set('view', 'detail');
      } else {
        url.searchParams.delete('view');
      }
      history.replaceState(null, '', url.toString());
    }
  }

  applyView(getInitialView(), false);
  document.getElementById('view-toggle-normal').addEventListener('click', function () {
    applyView('normal', true);
  });
  document.getElementById('view-toggle-detail').addEventListener('click', function () {
    applyView('detail', true);
  });

  // Agent switching is handled by the shared top-nav selector (see
  // _NAV_SCRIPT); loadHealth() reads _currentAgent() from the URL on each
  // page load, so no per-tab wiring is needed here.
  loadHealth();

  function render(d) {
    const cards = document.getElementById('cards');
    let html = '';

    // Health score gauge. engram-alpha#2524: null (import failure) is
    // rendered distinctly from a real score -- never as a fabricated
    // number the reader can't tell apart from a genuinely-bad graph.
    const scoreKnown = d.health_score !== null && d.health_score !== undefined;
    html += `<div class="card" style="text-align:center">
      <h3>Health Score</h3>
      <div class="gauge"><canvas id="gauge" width="120" height="120"></canvas>
        <div class="score" style="color:${scoreKnown ? scoreColor(d.health_score) : '#888'}">${scoreKnown ? d.health_score : 'unavailable'}</div>
      </div>
      ${scoreKnown ? '' : `<div style="font-size:0.8em; color:#f44336">${d.health_score_error || 'health_score unavailable'}</div>`}
      <div style="font-size:0.8em; color:#888">Turn ${d.current_turn}</div>
    </div>`;

    // Overview
    html += `<div class="card"><h3>Overview</h3>
      ${metric('Current nodes', d.total_current)}
      ${metric('Total (incl. superseded)', d.total_nodes)}
      ${metric('Edges', d.total_edges)}
      ${metric('Embedding coverage', d.embedding_pct + '%', d.embedding_pct < 80 ? 'warn' : 'good')}
      ${metric('Feeling reports', d.feeling_reports)}
    </div>`;

    // Issues
    const issues = d.tainted + d.stale + d.retracted + d.orphans;
    html += `<div class="card"><h3>Issues</h3>
      ${metric('Tainted nodes', d.tainted, d.tainted > 0 ? 'danger' : 'good')}
      ${metric('Stale nodes', d.stale, d.stale > 0 ? 'warn' : 'good')}
      ${metric('Retracted nodes', d.retracted, d.retracted > 10 ? 'warn' : '')}
      ${metric('Orphan nodes', d.orphans, d.orphans > 5 ? 'warn' : '')}
      ${metric('Total issues', issues, issues > 10 ? 'warn' : 'good')}
    </div>`;

    // Resolution
    html += `<div class="card"><h3>Resolution Rates</h3>
      ${metric('Questions', d.questions_resolved + '/' + d.questions_total + ' (' + pct(d.questions_resolved, d.questions_total) + ')')}
      ${metric('Conjectures', d.conjectures_resolved + '/' + d.conjectures_total + ' (' + pct(d.conjectures_resolved, d.conjectures_total) + ')')}
    </div>`;

    // Confidence distribution
    const confDist = d.confidence_distribution || {};
    const confMax = Math.max(...Object.values(confDist), 1);
    html += `<div class="card"><h3>Confidence Distribution</h3>
      <div class="bar-chart">
        ${Object.entries(confDist).map(([k,v]) =>
          `<div class="bar" style="height:${Math.max(v/confMax*80,2)}px; background:${confBarColor(k)}">
            <span class="bar-value">${v}</span><span class="bar-label">${k}</span></div>`
        ).join('')}
      </div>
    </div>`;

    // Node types
    const nc = d.node_counts || {};
    html += `<div class="card"><h3>Node Types</h3>
      ${Object.entries(nc).sort((a,b) => b[1].current - a[1].current).map(([t,c]) =>
        metric(t, c.current + (c.total > c.current ? ' (+' + (c.total - c.current) + ' old)' : ''))
      ).join('')}
    </div>`;

    // Edge types
    const ec = d.edge_counts || {};
    html += `<div class="card"><h3>Edge Types</h3>
      ${Object.entries(ec).sort((a,b) => b[1] - a[1]).map(([r,c]) => metric(r, c)).join('')}
    </div>`;

    // Edit timeline (last 7 days)
    const ebd = d.edit_by_day || {};
    const days = Object.keys(ebd).sort();
    if (days.length > 0) {
      html += `<div class="card" style="grid-column: span 2"><h3>Edit Activity (Last 7 Days)</h3>
        <div class="timeline">
          ${days.map(day => {
            const acts = ebd[day];
            return `<div class="day"><span class="date">${day}</span><div class="counts">
              ${Object.entries(acts).map(([a,c]) =>
                `<span class="tag-${tagClass(a)}">${a}: ${c}</span>`).join('')}
            </div></div>`;
          }).join('')}
        </div>
      </div>`;
    }

    // Health trend
    const trend = d.health_trend || [];
    if (trend.length > 1) {
      html += `<div class="card" style="grid-column: span 2"><h3>Health Score Trend</h3>
        <div class="trend"><svg id="trend-svg" viewBox="0 0 600 60"></svg></div>
      </div>`;
    }

    cards.innerHTML = html;

    // Draw gauge
    drawGauge(d.health_score);

    // Draw trend line
    if (trend.length > 1) drawTrend(trend);
  }

  function metric(label, value, cls) {
    return `<div class="metric"><span class="label">${label}</span><span class="value ${cls||''}">${value}</span></div>`;
  }
  function pct(a, b) { return b > 0 ? Math.round(a/b*100) + '%' : '0%'; }
  function scoreColor(s) { return s >= 80 ? '#4caf50' : s >= 60 ? '#ff9800' : '#f44336'; }
  function confBarColor(k) {
    const m = {'0.0-0.2':'#f44336','0.2-0.4':'#ff9800','0.4-0.6':'#ffeb3b','0.6-0.8':'#8bc34a','0.8-1.0':'#4caf50'};
    return m[k] || '#00d4ff';
  }
  function tagClass(a) {
    if (a === 'created') return 'created';
    if (a === 'superseded' || a === 'stale_flagged') return 'superseded';
    if (a === 'retracted' || a === 'tainted') return 'retracted';
    if (a === 'resolved' || a === 'reopened') return 'resolved';
    return 'other';
  }

  function drawGauge(score) {
    const c = document.getElementById('gauge');
    if (!c) return;
    const ctx = c.getContext('2d');
    const cx = 60, cy = 60, r = 50;
    // Background arc
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0.75 * Math.PI, 2.25 * Math.PI);
    ctx.strokeStyle = '#0f3460';
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    ctx.stroke();
    // engram-alpha#2524: score === null/undefined means "unavailable", not
    // "zero" -- (null / 100) coerces to 0 in JS arithmetic, which would
    // silently draw the exact same empty arc a real score=0 draws. Skip the
    // score arc entirely rather than let the two states look identical.
    if (score === null || score === undefined) return;
    // Score arc
    const angle = 0.75 * Math.PI + (score / 100) * 1.5 * Math.PI;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0.75 * Math.PI, angle);
    ctx.strokeStyle = scoreColor(score);
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  function drawTrend(trend) {
    const svg = document.getElementById('trend-svg');
    if (!svg || trend.length < 2) return;
    const w = 600, h = 60, pad = 10;
    const scores = trend.map(t => t.health_score);
    const mn = Math.min(...scores) - 5, mx = Math.max(...scores) + 5;
    const xScale = i => pad + i / (trend.length - 1) * (w - 2 * pad);
    const yScale = v => h - pad - (v - mn) / (mx - mn) * (h - 2 * pad);
    const pts = trend.map((t, i) => `${xScale(i)},${yScale(t.health_score)}`);
    svg.innerHTML = `<path d="M${pts.join(' L')}"/>` +
      trend.map((t, i) =>
        `<circle cx="${xScale(i)}" cy="${yScale(t.health_score)}" r="3"><title>Turn ${t.turn}: ${t.health_score}</title></circle>`
      ).join('');
  }

  // HTML-escape for DB-sourced strings used in innerHTML.
  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // Bucket boundaries for per-type histograms (5-6 buckets).
  // Reserved for future histogram rendering — V1 uses quantile display.
  const CAL_BUCKETS = [
    {lo: 0,    hi: 0.30, label: '<0.30', color: '#f44336'},
    {lo: 0.30, hi: 0.50, label: '0.30–0.50', color: '#ff9800'},
    {lo: 0.50, hi: 0.70, label: '0.50–0.70', color: '#ffeb3b'},
    {lo: 0.70, hi: 0.85, label: '0.70–0.85', color: '#8bc34a'},
    {lo: 0.85, hi: 0.95, label: '0.85–0.95', color: '#4caf50'},
    {lo: 0.95, hi: 1.01, label: '≥0.95',    color: '#00e676'},
  ];

  function calDeltaClass(delta) {
    const abs = Math.abs(delta);
    if (abs >= 0.15) return 'danger';
    if (abs >= 0.10) return 'warn';
    return 'good';
  }

  function renderCalibration(cal) {
    const cards = document.getElementById('cards');
    if (!cards) return;

    const corpus = cal.corpus || {};
    const byType = corpus.by_type || {};
    const byQt   = corpus.by_quote_type || {};
    const byRt   = corpus.by_reasoning_type || {};
    const drift  = cal.drift_by_type || {};

    const PRIMARY_TYPES = ['observation_factual', 'derivation', 'conjecture', 'lesson'];

    // ── Per-type histograms ───────────────────────────────────────────────
    let histHtml = '';
    for (const ntype of PRIMARY_TYPES) {
      const stats = byType[ntype] || {n: 0};
      const n = stats.n || 0;
      // We don't have raw distribution, so approximate from p-quantiles:
      // use n + p25/p50/p75/p90/p95 to assign fractional counts to buckets.
      // Simpler approach for V1: render a compact stats row instead of a
      // histogram (true bucket data requires a separate query not in the
      // current API shape). Display p25/p50/p75 summary row + N.
      if (n === 0) {
        histHtml += `<div class="cal-type-label">${esc(ntype)}</div>
          <div style="color:#888;font-size:0.78em;font-style:italic;">No data</div>`;
      } else {
        const p50 = stats.p50 !== null ? stats.p50.toFixed(2) : '—';
        const p25 = stats.p25 !== null ? stats.p25.toFixed(2) : '—';
        const p75 = stats.p75 !== null ? stats.p75.toFixed(2) : '—';
        const mean = stats.mean !== null ? stats.mean.toFixed(3) : '—';
        histHtml += `<div class="cal-type-label">${esc(ntype)} <span style="color:#888;font-weight:normal;">(n=${n})</span></div>
          ${metric('p25 / p50 / p75', p25 + ' / ' + p50 + ' / ' + p75)}
          ${metric('mean', mean)}`;
      }
    }

    // ── Per-quote_type table ──────────────────────────────────────────────
    const qtEntries = Object.entries(byQt).sort((a, b) => b[1].n - a[1].n);
    let qtHtml = '';
    if (qtEntries.length === 0) {
      qtHtml = '<p class="empty" style="padding:8px 0;">No quote_type data yet.</p>';
    } else {
      qtHtml = '<table><thead><tr><th>quote_type</th><th style="text-align:right">n</th><th style="text-align:right">mean</th></tr></thead><tbody>';
      for (const [qt, s] of qtEntries) {
        qtHtml += `<tr><td>${esc(qt)}</td><td style="text-align:right">${s.n}</td><td style="text-align:right">${s.mean.toFixed(3)}</td></tr>`;
      }
      qtHtml += '</tbody></table>';
      qtHtml += '<p class="cal-caption">the structural-confidence-determination axiom — structural anchoring — see ob_NNNN for the 2D matrix design.</p>';
    }

    // ── Per-reasoning_type table ──────────────────────────────────────────
    const rtEntries = Object.entries(byRt).sort((a, b) => b[1].n - a[1].n);
    let rtHtml = '';
    if (rtEntries.length === 0) {
      rtHtml = '<p class="empty" style="padding:8px 0;">No reasoning_type data yet.</p>';
    } else {
      rtHtml = '<table><thead><tr><th>reasoning_type</th><th style="text-align:right">n</th><th style="text-align:right">mean</th></tr></thead><tbody>';
      for (const [rt, s] of rtEntries) {
        rtHtml += `<tr><td>${esc(rt)}</td><td style="text-align:right">${s.n}</td><td style="text-align:right">${s.mean.toFixed(3)}</td></tr>`;
      }
      rtHtml += '</tbody></table>';
    }

    // ── Drift indicator ───────────────────────────────────────────────────
    let driftHtml = '';
    const driftEntries = Object.entries(drift);
    if (driftEntries.length === 0) {
      driftHtml = '<p style="color:#888;font-size:0.8em;font-style:italic;">No this-turn data yet — drift available after first filing.</p>';
    } else {
      for (const [ntype, d] of driftEntries) {
        const cls = calDeltaClass(d.delta);
        const sign = d.delta >= 0 ? '+' : '';
        driftHtml += `<div class="metric">
          <span class="label">${esc(ntype)}</span>
          <span class="value ${cls}" title="this_turn p50=${d.this_turn_p50} corpus p50=${d.corpus_p50} n_this_turn=${d.n_this_turn}">
            ${d.this_turn_p50.toFixed(2)} vs ${d.corpus_p50.toFixed(2)} · delta ${sign}${d.delta.toFixed(3)}
          </span>
        </div>`;
      }
    }

    // ── Assemble card ─────────────────────────────────────────────────────
    const cardHtml = `<div class="card" style="grid-column: span 2">
      <h3>Confidence Calibration</h3>
      <h2 style="margin-top:0;margin-bottom:6px;">Per-Type Summary (corpus)</h2>
      ${histHtml}
      <h2>Per-Quote-Type (observation_factual)</h2>
      ${qtHtml}
      <h2>Per-Reasoning-Type (derivation)</h2>
      ${rtHtml}
      <h2>Drift: This Turn vs Corpus (p50 delta)</h2>
      ${driftHtml}
    </div>`;

    cards.innerHTML += cardHtml;
  }

  // ── Detail view: history strip + distribution over /api/health/v2/series
  //    (engram-alpha#2518 detail-view slice) ───────────────────────────────
  // Lazy-loaded once (see applyView()'s `if (isDetail) { loadDetailView(); }`
  // hook above) -- fetches /api/health/v2 (today's snapshot: signal_rows,
  // aspect_tile, composed, provenance) and /api/health/v2/series (per-point
  // history for the composed score and every signal) in parallel, then
  // renders the whole #detail-view content in one pass. computeDistribution
  // Stats/computeHistogramBins live in the separately-loaded
  // /static/health-detail-math.js (pure math, DOM-free, unit-tested
  // directly under `node` -- see tests/test_viz_health_v2_detail_view.py).

  var _detailLoaded = false;

  function loadDetailView() {
    if (_detailLoaded) return;
    _detailLoaded = true;
    Promise.all([
      fetch(_withAgent('/api/health/v2')).then(r => r.json()),
      fetch(_withAgent('/api/health/v2/series')).then(r => r.json()).catch(() => null),
    ]).then(([data, seriesData]) => {
      renderDetailView(data, seriesData);
    }).catch(e => {
      var emptyEl = document.getElementById('detail-empty-state');
      var contentEl = document.getElementById('detail-content');
      emptyEl.textContent = 'Error loading detail view: ' + e.message;
      emptyEl.style.display = '';
      contentEl.style.display = 'none';
    });
  }

  // Classifies the /api/health/v2/series response into one shape every
  // renderer below reads uniformly, regardless of WHY the series is
  // unavailable (a `.catch(() => null)` network failure vs. a fail-honest
  // `{error, reason}` dict from the endpoint itself) -- per the spec's
  // error-states requirement, both collapse to "show an inline note instead
  // of a chart", never a broken/blank chart.
  function _classifySeries(seriesData) {
    if (!seriesData || seriesData.error) {
      var note;
      if (!seriesData) {
        note = 'no history yet on this seat';
      } else if (seriesData.reason === 'no_db') {
        note = 'no history yet on this seat';
      } else {
        note = seriesData.error;
      }
      return { ok: false, note: note, data: null, scoresAvailable: false };
    }
    return {
      ok: true,
      note: null,
      data: seriesData,
      scoresAvailable: seriesData.scores_available !== false,
    };
  }

  function _statusClass(status) {
    // JUDGMENT CALL (flagged in the dispatching report): the spec asks for
    // "a small distinct visual treatment" per status but doesn't prescribe
    // which of the existing .value.warn/.danger/.good buckets each of the
    // four statuses maps to. "scored" (fully counted) reads as good;
    // "unavailable" (this run's own raw value declined) reads as danger;
    // "held_out" and "measured_not_scored" are both "not currently moving
    // the composed score" but for structurally different reasons -- both
    // land on warn rather than good/danger since neither is a failure.
    if (status === 'scored') return 'good';
    if (status === 'unavailable') return 'danger';
    if (status === 'held_out' || status === 'measured_not_scored') return 'warn';
    return '';
  }

  function renderDetailView(data, seriesData) {
    var emptyEl = document.getElementById('detail-empty-state');
    var contentEl = document.getElementById('detail-content');
    if (!data || data.has_snapshot === false) {
      emptyEl.textContent = (data && data.reason) ? data.reason
        : 'No detail-view snapshot data yet — this view is under construction.';
      emptyEl.style.display = '';
      contentEl.style.display = 'none';
      return;
    }
    emptyEl.style.display = 'none';
    contentEl.style.display = '';

    var seriesInfo = _classifySeries(seriesData);

    var noteEl = document.getElementById('detail-scores-note');
    if (seriesInfo.ok && !seriesInfo.scoresAvailable) {
      noteEl.textContent = 'score history unavailable for this model version — showing raw values.';
      noteEl.style.display = '';
    } else {
      noteEl.style.display = 'none';
    }

    renderComposedBlock(data, seriesInfo);
    renderSignalRows(data.signal_rows || [], seriesInfo);
    renderAspectTiles(data.aspect_tile || []);
  }

  function renderComposedBlock(data, seriesInfo) {
    var prov = data.provenance || {};
    var composed = data.composed || {};
    var el = document.getElementById('detail-composed-block');
    el.innerHTML = '<div class="card">' +
        '<h3>Composed Score</h3>' +
        '<div class="detail-composed-value">' + esc(composed.value) + '</div>' +
        '<div class="detail-provenance">as of ' + esc(prov.written_at || 'unknown') + '</div>' +
        '<div class="metric"><span class="label">snapshot</span><span class="value">' + esc(prov.snapshot_id) + '</span></div>' +
        '<div class="metric"><span class="label">turn</span><span class="value">' + esc(prov.turn) + '</span></div>' +
        '<div class="metric"><span class="label">checkpoint_mode</span><span class="value">' + esc(prov.checkpoint_mode) + '</span></div>' +
        '<div class="metric"><span class="label">health_version</span><span class="value">' + esc(prov.health_version) + '</span></div>' +
        '<div class="detail-strip-dist-container" id="detail-composed-strip-dist"></div>' +
      '</div>';
    var container = document.getElementById('detail-composed-strip-dist');
    if (!seriesInfo.ok) {
      renderStripAndDistribution(container, [], seriesInfo.note);
      return;
    }
    var points = (seriesInfo.data.composed || []).map(p => ({ t: p.t, value: p.value, unreplayable: null }));
    // Anchor-overlay hook point: a future anchors overlay (known_bad/
    // known_good/incident/repair markers from the not-yet-built
    // /api/health/v2/anchors) would render into this same strip container,
    // keyed by point .t -- not built in this slice (#2518 §5 ownership).
    renderStripAndDistribution(container, points, null);
  }

  function renderSignalRows(signalRows, seriesInfo) {
    var el = document.getElementById('detail-signal-rows');
    el.innerHTML = signalRows.map((row, idx) => {
      var def = row.definition || {};
      var today = row.today || {};
      var num = def.numerator || {};
      var den = def.denominator || {};
      return '<div class="card detail-signal-row">' +
        '<h3>' + esc(row.name) + ' <span class="detail-status-badge ' + _statusClass(row.status) + '">' + esc(row.status) + '</span></h3>' +
        '<div class="metric"><span class="label">formula</span><span class="value">' + esc(def.formula) + '</span></div>' +
        '<div class="metric"><span class="label">' + esc(num.label) + '</span><span class="value">' + esc(num.value) + '</span></div>' +
        '<div class="metric"><span class="label">' + esc(den.label) + '</span><span class="value">' + esc(den.value) + '</span></div>' +
        '<div class="metric"><span class="label">raw</span><span class="value">' + esc(today.raw) + '</span></div>' +
        '<div class="metric"><span class="label">score</span><span class="value">' + esc(today.score) + '</span></div>' +
        '<div class="detail-strip-dist-container" id="detail-signal-strip-' + idx + '"></div>' +
      '</div>';
    }).join('');

    signalRows.forEach((row, idx) => {
      var container = document.getElementById('detail-signal-strip-' + idx);
      if (!seriesInfo.ok) {
        renderStripAndDistribution(container, [], seriesInfo.note);
        return;
      }
      // Scope decision (yours-to-keep, per the spec): drive the strip off
      // `score` when series.scores_available is true, else off `raw` --
      // ONE strip per row in this slice, not a separate raw-and-score pair.
      var valueKey = seriesInfo.scoresAvailable ? 'score' : 'raw';
      var seriesArr = (seriesInfo.data.signals || {})[row.name] || [];
      var points = seriesArr.map(p => ({ t: p.t, value: p[valueKey], unreplayable: p.unreplayable }));
      renderStripAndDistribution(container, points, null);
    });
  }

  function renderAspectTiles(aspectTile) {
    var el = document.getElementById('detail-aspect-tiles');
    if (!aspectTile.length) { el.innerHTML = ''; return; }
    // Plain list, no history/distribution -- explicitly out of scope for
    // aspects in this slice (#2518 §2c).
    el.innerHTML = '<div class="card"><h3>Aspects</h3>' +
      aspectTile.map(a => {
        var label = esc(a.name) + (a.unscored ? ' (unscored)' : '');
        var value = esc(a.score) + (a.coverage !== undefined && a.coverage !== null ? ' · coverage ' + esc(a.coverage) : '');
        return '<div class="metric"><span class="label">' + label + '</span><span class="value">' + value + '</span></div>';
      }).join('') +
      '</div>';
  }

  // One Series/Histogram toggle + its strip container + its distribution
  // container, OR (when `note` is given) a small inline note instead of a
  // chart -- shared by the composed block and every signal row.
  var _detailStripCounter = 0;

  function renderStripAndDistribution(parentEl, points, note) {
    if (note) {
      parentEl.innerHTML = '<div class="detail-series-note">' + esc(note) + '</div>';
      return;
    }
    var idBase = 'detail-ds-' + (_detailStripCounter++);
    var stripId = idBase + '-strip';
    var distId = idBase + '-dist';
    parentEl.innerHTML =
      '<div class="view-toggle detail-mini-toggle">' +
        '<button type="button" class="view-toggle-btn detail-mini-toggle-btn active" data-mode="series">Series</button>' +
        '<button type="button" class="view-toggle-btn detail-mini-toggle-btn" data-mode="histogram">Histogram</button>' +
      '</div>' +
      '<div class="detail-strip trend" id="' + stripId + '"></div>' +
      '<div class="detail-distribution" id="' + distId + '" style="display:none;"></div>';

    var stripEl = document.getElementById(stripId);
    var distEl = document.getElementById(distId);
    renderHistoryStrip(stripEl, points);
    var plottedValues = points
      .filter(p => p.value !== null && p.value !== 'UNAVAILABLE' && p.value !== undefined)
      .map(p => p.value);
    renderDistributionPanel(distEl, plottedValues);

    var btns = parentEl.querySelectorAll('.detail-mini-toggle-btn');
    btns.forEach(btn => {
      btn.addEventListener('click', () => {
        var mode = btn.getAttribute('data-mode');
        btns.forEach(b => b.classList.toggle('active', b === btn));
        stripEl.style.display = mode === 'series' ? '' : 'none';
        distEl.style.display = mode === 'histogram' ? '' : 'none';
      });
    });
  }

  // Adapts the existing drawTrend() SVG pattern (path + circles, <title>
  // tooltips) rather than inventing a new charting approach -- reuses
  // .trend's own path/circle CSS (stroke/fill) via the container's "trend"
  // class; per-circle overrides below use an inline `style=` (not a bare
  // `fill=` attribute) since a CSS class declaration always wins over a
  // plain SVG presentation attribute of the same specificity.
  // `p.unreplayable` (per series.export()'s own code, not just its prose
  // docstring -- read directly from health/series.py:3488-3503 to confirm)
  // is NOT a plain string: it's `{numKey: {reason, class}, denKey: {reason,
  // class}}` (only the keys that are actually unreplayable are present), or
  // `null`/`undefined` when neither is. Pull the human-readable `.reason`
  // text(s) out rather than `String()`-ing the object directly (which would
  // render the useless literal "[object Object]").
  function _unreplayableLabel(unrep) {
    if (!unrep || typeof unrep !== 'object') return 'unavailable';
    var reasons = Object.keys(unrep).map(k => {
      var info = unrep[k];
      return (info && info.reason) ? String(info.reason) : String(info);
    });
    return reasons.length ? reasons.join('; ') : 'unavailable';
  }

  function renderHistoryStrip(containerEl, points) {
    // Points already arrive ordered by `t` ascending (export()'s own
    // docstring) -- this sort is defensive insurance, a no-op when already
    // sorted, never assumed away.
    var pts = points.slice().sort((a, b) => (a.t < b.t ? -1 : a.t > b.t ? 1 : 0));
    var w = 300, h = 60, pad = 10;
    var n = pts.length;
    if (n === 0) {
      containerEl.innerHTML = '<div class="detail-strip-empty">no history yet</div>';
      return;
    }
    // "Today" is the chronologically-latest point (max `t`) across ALL
    // points -- computed here, BEFORE the unreplayable filter below, so an
    // unreplayable true-latest point is never silently promoted-away in
    // favor of an older plotted point (#2625: the old `idx === plotted.length
    // - 1` computed "today" from the FILTERED array, which excludes
    // unreplayable points and so picked a stale point whenever the true
    // latest was itself unreplayable).
    var todayIdx = n - 1;
    var plotted = [];
    var markers = [];
    pts.forEach((p, i) => {
      if (p.value === null || p.value === 'UNAVAILABLE' || p.value === undefined) {
        markers.push({ i: i, unreplayable: p.unreplayable });
      } else {
        plotted.push({ i: i, value: p.value });
      }
    });
    if (plotted.length === 0) {
      containerEl.innerHTML = '<div class="detail-strip-empty">no plottable points</div>';
      return;
    }
    var values = plotted.map(p => p.value);
    var mn = Math.min(...values), mx = Math.max(...values);
    if (mn === mx) { mn -= 1; mx += 1; }
    var xScale = i => pad + (n > 1 ? i / (n - 1) : 0.5) * (w - 2 * pad);
    var yScale = v => h - pad - (v - mn) / (mx - mn) * (h - 2 * pad);
    var pathPts = plotted.map(p => xScale(p.i) + ',' + yScale(p.value));
    var circles = plotted.map(p => {
      var isToday = p.i === todayIdx; // true latest point, and it's plottable
      var r = isToday ? 5 : 3;
      var styleAttr = isToday ? ' style="fill:#fff"' : '';
      var titleText = esc(String(p.value)) + (isToday ? ' (today)' : '');
      return '<circle cx="' + xScale(p.i) + '" cy="' + yScale(p.value) + '" r="' + r + '"' + styleAttr + '><title>' + titleText + '</title></circle>';
    }).join('');
    var ticks = markers.map(m => {
      var x = xScale(m.i);
      var label = _unreplayableLabel(m.unreplayable);
      if (m.i === todayIdx) {
        // True latest point, but unreplayable: do NOT promote an older
        // plotted point to "today" (#2625). Render a hollow-circle marker
        // -- stroked like the ordinary unreplayable tick, distinguished
        // from it only by shape + tooltip -- instead of the dashed tick
        // line, at this same x. No plotted circle above gets "(today)".
        var todayTitle = '(today — unreplayable: ' + label + ')';
        return '<circle class="detail-unreplayable-today-marker" cx="' + x + '" cy="' + (h / 2) + '" r="5"><title>' + esc(todayTitle) + '</title></circle>';
      }
      return '<line class="detail-unreplayable-tick" x1="' + x + '" y1="' + pad + '" x2="' + x + '" y2="' + (h - pad) + '"><title>' + esc(label) + '</title></line>';
    }).join('');
    containerEl.innerHTML = '<svg viewBox="0 0 ' + w + ' ' + h + '">' +
      ticks +
      '<path d="M' + pathPts.join(' L') + '"/>' +
      circles +
      '</svg>';
  }

  function renderDistributionPanel(containerEl, values) {
    var stats = computeDistributionStats(values);
    if (!stats) {
      containerEl.innerHTML = '<div class="detail-dist-empty">insufficient data</div>';
      return;
    }
    var statsHtml = '<div class="detail-stats-table">' +
      ['min', 'p10', 'p25', 'p50', 'p75', 'p90', 'max', 'mean', 'sd'].map(k =>
        '<div class="metric"><span class="label">' + k + '</span><span class="value">' + stats[k].toFixed(3) + '</span></div>'
      ).join('') +
      '</div>';
    var hist = computeHistogramBins(values);
    var maxCount = Math.max(...hist.counts, 1);
    var barsHtml = '<div class="bar-chart detail-histogram">' +
      hist.counts.map((c, i) => {
        var lo = hist.edges[i], hi = hist.edges[i + 1];
        var label = lo.toFixed(2) + '–' + hi.toFixed(2);
        return '<div class="bar" style="height:' + Math.max(c / maxCount * 80, 2) + 'px;">' +
          '<span class="bar-value">' + c + '</span><span class="bar-label">' + esc(label) + '</span></div>';
      }).join('') +
      '</div>';
    containerEl.innerHTML = statsHtml + barsHtml;
  }
  </script>
<script src="/static/nav.js"></script>
