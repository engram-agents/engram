[pytest]
markers =
    real_dns: test exercises real DNS resolution; opt out of the conftest mock
    timing: asserts a measured ratio/latency bound a tracer inflates; skips under a tracer, judged in the nightly's no-coverage timing step (-m timing)
    owner_schema_gate_real: test exercises the owner's schema-version gate for real; opt out of the conftest default that stamps a behind, hand-built store (#3753)
# Same policy as nightly.yml's suite step, so a local run sees what the nightly sees (#4392).
tmp_path_retention_policy = failed
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} docs
